// ---------- online backup and live sharing ----------
// Local storage stays the working copy. When the page can reach its online store, every schedule,
// squad member, saved match and the live game are mirrored there, and changes from other phones
// (yours or a coach's) flow back in live.
const DEVICE = (() => { try{ let d = localStorage.getItem(LS + '.device'); if(!d){ d = uid(); localStorage.setItem(LS + '.device', d); } return d; }catch(e){ return uid(); } })();
function stable(v){ return JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x) ? Object.keys(x).sort().reduce((o, key) => (o[key] = x[key], o), {}) : x); }
function cloudSchedule(sc){
  const sq = S.squad || {}, lite = p => (p.pid && sq[p.pid] && sq[p.pid].photo && sq[p.pid].photo === p.photo) ? Object.assign({}, p, {photo:'@squad'}) : p;
  return {name:sc.name, setup:Object.assign({}, sc.setup, {tracks:sc.setup.tracks.map(t => Object.assign({}, t, {players:t.players.map(lite)}))}), others:(sc.others || []).map(lite)};
}
function cloudDocs(){
  const m = {};
  S.schedules.forEach(sc => { m['schedules/' + sc.id] = cloudSchedule(sc); });
  Object.keys(S.squad || {}).forEach(k => { m['squad/' + k] = S.squad[k]; });
  S.matches.forEach(x => { m['matches/' + x.id] = x; });
  m['live/game'] = {game:Object.assign({}, S.game, {history:[]}), activeId:S.activeId};
  return JSON.parse(JSON.stringify(m));
}
function setSync(st){ sync.status = st; const el = $('syncstat'); if(el){ el.textContent = {local:'On this phone only', saving:'Saving…', saved:'Backed up', error:'Backup paused'}[st] || ''; el.dataset.st = st; }
  const info = $('syncinfo'); if(info) info.innerHTML = syncInfo(); }
function syncInfo(){
  if(!db) return 'Everything is saved on this phone only. Online backup works when this page is open in Claude while you’re signed in.';
  if(sync.status === 'error') return 'Online backup hit a problem, so changes are kept on this phone for now and will be tried again on your next change.';
  return 'Everything is backed up online and stays in sync on any phone or computer where you open this page. To share the live game with a coach, use the <b>Share</b> button at the top of this page and give them edit access. They’ll see the same clock and swaps and can call swaps too.';
}
function queueSync(){ if(!db || !sync.ready || applyingRemote) return; clearTimeout(sync.timer); sync.timer = setTimeout(pushSync, 700); }
async function pushSync(){
  if(!db || !sync.ready) return;
  if(sync.running){ sync.dirty = true; return; }
  sync.running = true; let failed = false; setSync('saving');
  try{
    do{
      sync.dirty = false;
      const want = cloudDocs();
      for(const p of Object.keys(want)){
        const js = stable(want[p]); if(sync.last[p] === js) continue;
        if(js.length > 250000){ failed = true; continue; }
        const prev = sync.last[p]; sync.last[p] = js;
        try{ await db.doc(p).set(Object.assign({}, want[p], {_by:DEVICE, _at:Date.now()})); }
        catch(e){ if(prev === undefined) delete sync.last[p]; else sync.last[p] = prev; failed = true; }
      }
      for(const p of Object.keys(sync.last)){ if(!(p in want)){ try{ await db.doc(p).delete(); delete sync.last[p]; }catch(e){ failed = true; } } }
    } while(sync.dirty);
  } finally { sync.running = false; setSync(failed ? 'error' : 'saved'); }
}
function strip(d){ const o = Object.assign({}, d); delete o._by; delete o._at; return JSON.parse(JSON.stringify(o)); }
function applyDoc(col, id, body){
  if(col === 'schedules'){
    const sc = S.schedules.find(x => x.id === id);
    if(sc) Object.assign(sc, {name:body.name, setup:body.setup, others:body.others || []}); else S.schedules.push({id, name:body.name, setup:body.setup, others:body.others || []});
  } else if(col === 'squad'){
    // A new clean photo from another phone replaces that player's picture in every schedule too.
    const before = S.squad[id]; S.squad[id] = body;
    if(body.clean && body.photo && (!before || before.photo !== body.photo)) allPlayers().forEach(p => { if(p.pid === id) p.photo = body.photo; });
  }
  else if(col === 'matches'){ const i = S.matches.findIndex(x => x.id === id); if(i >= 0) S.matches[i] = body; else S.matches.push(body); }
}
function removeDoc(col, id){
  if(col === 'schedules'){ S.schedules = S.schedules.filter(x => x.id !== id);
    if(!S.schedules.length) S.schedules.push({id:'s1', name:'BRAX - LEOP', setup:clone(DEFAULT_SETUP)});
    if(!S.schedules.some(x => x.id === S.activeId)){ S.activeId = S.schedules[0].id; S.game = newGame(U()); } }
  else if(col === 'squad') delete S.squad[id];
  else if(col === 'matches') S.matches = S.matches.filter(x => x.id !== id);
}
let remoteTimer = null;
function afterRemote(){
  // Fill in photos that point at squad members now that both have arrived.
  allPlayers().forEach(p => { if(p.photo === '@squad' && S.squad[p.pid] && S.squad[p.pid].photo) p.photo = S.squad[p.pid].photo; });
  const fixed = ensureGameFits(); if(sync.ready) mergeSquadDuplicates();
  if(syncSquadPhotos() || fixed) queueSync();
  applyingRemote = true; try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} applyingRemote = false;
  // Don't redraw Setup under someone's fingers while they type.
  clearTimeout(remoteTimer);
  remoteTimer = setTimeout(() => { const a = document.activeElement; if(S.view === 'setup' && a && a.matches('input,select')) return; show(); }, 150);
}
function markGot(key, snap){
  if(snap.metadata && snap.metadata.fromCache) return;
  sync.got.add(key);
  if(!sync.ready && sync.got.size === 4){
    sync.ready = true;
    // A phone opening this page for the first time takes the online copy instead of its example board.
    if(FRESH && Object.keys(sync.last).some(p => p.startsWith('schedules/'))){
      S.schedules = S.schedules.filter(sc => sync.last['schedules/' + sc.id]);
      if(!S.schedules.some(x => x.id === S.activeId)){ S.activeId = S.schedules[0].id; S.game = newGame(U()); }
      afterRemote();
    }
    pushSync();
  }
}
function startSync(){
  ['schedules', 'squad', 'matches'].forEach(col => {
    db.collection(col).onSnapshot(snap => {
      let changed = false; const seen = new Set();
      snap.docs.forEach(d => { const p = col + '/' + d.id; seen.add(p);
        const body = strip(d.data()), js = stable(body);
        if(sync.last[p] === js) return;
        sync.last[p] = js; applyDoc(col, d.id, body); changed = true; });
      if(!snap.metadata.fromCache && sync.ready){
        Object.keys(sync.last).filter(p => p.startsWith(col + '/') && !seen.has(p)).forEach(p => { delete sync.last[p]; removeDoc(col, p.slice(col.length + 1)); changed = true; });
      }
      if(changed) afterRemote();
      markGot(col, snap);
    }, () => setSync('error'));
  });
  db.doc('live/game').onSnapshot(snap => {
    if(snap.exists){
      const body = strip(snap.data()), js = stable(body);
      if(sync.last['live/game'] !== js && body.game){
        sync.last['live/game'] = js;
        S.game = body.game; S.game.history = []; // undo only covers this phone's own actions
        if(body.activeId && S.schedules.some(x => x.id === body.activeId)) S.activeId = body.activeId;
        injUI = null; cardUI = null; afterRemote();
      }
    }
    markGot('live', snap);
  }, () => setSync('error'));
}
if(window.claude && window.claude.use){
  window.claude.use('db').then(d => { if(d){ db = d; setSync('saving'); startSync(); setTimeout(() => { if(!sync.ready) setSync('error'); }, 20000); } else setSync('local'); }).catch(() => setSync('local'));
  window.claude.use('downloads').then(d => { dl = d; if(S.view === 'minutes') renderMinutes(); }).catch(() => {});
}

// ---------- clicks ----------
let resetArm = 0;
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const a = b.dataset.act, u = U();
  // Tap protection: "Swap done" / "Already swapped" need a second tap within 3 s.
  if(a === 'swap' && S.settings.confirm && !(b.dataset.armed && Date.now() - b.dataset.armed < 3000)){
    const old = b.textContent; b.dataset.armed = Date.now(); b.textContent = 'Tap again to confirm'; b.classList.add('armed');
    setTimeout(() => { if(b.isConnected){ b.textContent = old; delete b.dataset.armed; b.classList.remove('armed'); } }, 3000);
    return;
  }
  if(a === 'tab'){ S.view = b.dataset.v; save(); show(); }
  else if(a === 'testbuzz'){ ensureAudio(); beep(3, 1040); buzz([300,120,300,120,300]);
    $('buzzmsg').textContent = canVibrate() ? 'Did your phone buzz? If not, check that vibration is on in your phone’s sound settings.'
      : 'You should hear three beeps. On iPhone you may feel a light tap instead of a strong buzz, because iPhones limit what web pages can do. Keep the volume up and silent mode off.'; }
  else if(a === 'cardopen'){ cardUI = cardUI && cardUI.id === b.dataset.id ? null : {id:b.dataset.id, k:null}; injUI = null; renderGame(); update(); }
  else if(a === 'cardpick'){ cardUI = {id:b.dataset.id, k:+b.dataset.k}; renderGame(); update(); }
  else if(a === 'cardclose'){ cardUI = null; renderGame(); update(); }
  else if(a === 'cardgive') giveCard(b.dataset.id, +b.dataset.k, b.dataset.type);
  else if(a === 'practice'){ S.game = newGame(U()); S.game.speed = 10; S.game.practice = true; save(); show(); }
  else if(a === 'endpractice'){ S.game = newGame(U()); save(); show(); }
  else if(a === 'copyreport') copyReport();
  else if(a === 'csv') saveCsv();
  else if(a === 'savematch'){ saveMatch(); reportMsg = 'Added to the season log.'; renderMinutes(); }
  else if(a === 'delmatch'){ S.matches = S.matches.filter(x => x.id !== b.dataset.mid); save(); renderMinutes(); }
  else if(a === 'addo'){ const sc = sched(); sc.others = sc.others || []; sc.others.push({name:'', photo:'', why:'Reserve', pid:uid()}); save(); renderSetup(); }
  else if(a === 'delo'){ (sched().others || []).splice(+b.dataset.i, 1); save(); renderSetup(); }
  else if(a === 'go') go();
  else if(a === 'fullscreen'){
    // Fills the screen, hiding the viewer's banner, where the device allows it.
    const el = document.documentElement;
    if(document.fullscreenElement) document.exitFullscreen && document.exitFullscreen().catch(() => {});
    else if(el.requestFullscreen) el.requestFullscreen().catch(() => { b.hidden = true; });
  }
  else if(a === 'adj') adj(+b.dataset.d);
  else if(a === 'swap') swap(b.dataset.id);
  else if(a === 'undo') undo();
  else if(a === 'resetlines') resetLines();
  else if(a === 'injopen'){ injUI = injUI && injUI.id === b.dataset.id ? null : {id:b.dataset.id, k:null}; cardUI = null; renderGame(); update(); }
  else if(a === 'injpick'){ injUI = {id:b.dataset.id, k:+b.dataset.k}; renderGame(); update(); }
  else if(a === 'injclose'){ injUI = null; renderGame(); update(); }
  else if(a === 'injbench') injure(b.dataset.id, +b.dataset.k, 'bench');
  else if(a === 'injres'){ const inp = $('res-' + b.dataset.id); injure(b.dataset.id, +b.dataset.k, 'reserve', inp ? inp.value : ''); }
  else if(a === 'back') backOn(b.dataset.id, +b.dataset.k);
  else if(a === 'stagger') autoStagger();
  else if(a === 'addp'){ const t = track(b.dataset.id); t.players.push({name:`${t.name} ${t.players.length+1}`, bench:2}); structural(); }
  else if(a === 'delp'){ track(b.dataset.id).players.splice(+b.dataset.k, 1); structural(); }
  else if(a === 'addt'){ const id = 't' + Date.now(); u.tracks.push({id, name:'New line', color:'#2E8B57', offset:0, players:[{name:'Player 1',bench:3},{name:'Player 2',bench:3}]}); structural(); }
  else if(a === 'delt'){ u.tracks = u.tracks.filter(t => t.id !== b.dataset.id); structural(); }
  else if(a === 'defaults'){ sched().setup = clone(DEFAULT_SETUP); structural(); }
  else if(a === 'up'){ const ps = track(b.dataset.id).players, k = +b.dataset.k; [ps[k-1], ps[k]] = [ps[k], ps[k-1]]; structural(); }
  else if(a === 'sdup'){ const id = 's' + Date.now(); S.schedules.push({id, name:sched().name + ' (copy)', setup:clone(U()), others:clone(sched().others || [])}); S.activeId = id; structural(); }
  else if(a === 'snew'){ const id = 's' + Date.now();
    S.schedules.push({id, name:'New schedule', setup:{quarterMin:u.quarterMin, quarters:u.quarters, tracks:[{id:'t'+Date.now(), name:'Line 1', color:'#E3262B', offset:0, players:[{name:'Player 1',bench:3},{name:'Player 2',bench:3},{name:'Player 3',bench:3}]}]}});
    S.activeId = id; structural(); }
  else if(a === 'sdel'){ S.schedules = S.schedules.filter(x => x.id !== S.activeId); S.activeId = S.schedules[0].id; structural(); }
  else if(a === 'stopread'){ if(readCtl) readCtl.abort(); }
  else if(a === 'sqdel'){ delete S.squad[b.dataset.pid]; save(); renderSquad(); }
  else if(a === 'exportdata') exportFile();
  else if(a === 'savekey'){ const v = ($('api-key') || {}).value || ''; if(v.trim()){ setKey(v.trim()); useApiKey(); renderSetup(); } }
  else if(a === 'delkey'){ setKey(''); useApiKey(); renderSetup(); }
  else if(a === 'pickimport'){ const f = $('import-file'); if(f) f.click(); }
  else if(a === 'pickteam'){ const f = $('team-files'); if(f) f.click(); }
  else if(a === 'pickclean'){ const f = $('clean-files'); if(f) f.click(); }
  else if(a === 'cpskip'){ cleanPending.splice(+b.dataset.i, 1); renderSetup(); }
  else if(a === 'pickboard'){ const f = $('board-file'); if(f) f.click(); }
  else if(a === 'pickph'){ const f = $(b.dataset.for); if(f) f.click(); }
  else if(a === 'call') callSwap(b.dataset.id);
  else if(a === 'cancel') cancelCall(b.dataset.id);
  else if(a === 'reset'){
    if(Date.now() - resetArm < 3000){ S.game = newGame(U()); resetArm = 0; save(); show(); }
    else { resetArm = Date.now(); b.textContent = 'Tap again to reset'; setTimeout(() => { if(b.isConnected) b.textContent = 'Reset game'; }, 3000); }
  }
});
function structural(){ ensureSquad(); S.game = newGame(U()); save(); show(); }

function renderSquad(){
  const el = $('squadlist'); if(!el) return;
  const ids = Object.keys(S.squad).sort((a, b) => S.squad[a].name.localeCompare(S.squad[b].name));
  el.innerHTML = ids.length
    ? `<div class="squad">${ids.map(k => `<div class="sq"><button class="avbtn" data-act="pickph" data-for="sqph-${k}" aria-label="Change photo of ${esc(S.squad[k].name)}">${av(S.squad[k])}</button><input type="file" id="sqph-${k}" accept="image/*" class="vh" tabindex="-1" aria-hidden="true"><input type="text" id="sq-${k}-name" value="${esc(S.squad[k].name)}" aria-label="Name"><button data-act="sqdel" data-pid="${k}" aria-label="Remove ${esc(S.squad[k].name)} from the squad">×</button></div>`).join('')}</div>`
    : '<p class="note">No one yet. Type a real name for a player above and they’re added here with their photo.</p>';
}
document.addEventListener('change', e => {
  const id = e.target.id; let m;
  if(m = id.match(/^p-(.+)-(\d+)-name$/)){ const t = track(m[1]), p = t && t.players[+m[2]]; if(!p) return;
    couple(p); syncSquadPhotos(); e.target.value = p.name; save(); renderSetup(); renderGame(); update(); }
  else if(m = id.match(/^o-(\d+)-name$/)){ const o = (sched().others || [])[+m[1]]; if(!o) return;
    o.name = e.target.value.trim(); couple(o); syncSquadPhotos(); e.target.value = o.name; save(); renderSetup(); renderGame(); update(); }
  else if(m = id.match(/^sq-(.+)-name$/)){ const sq = S.squad[m[1]], v = e.target.value.trim(); if(!sq || !v) return;
    sq.name = v; allPlayers().forEach(q => { if(q.pid === m[1]) q.name = v; }); save(); renderSetup(); renderGame(); update(); }
});

function show(){
  ensureGameFits();
  ['game','plan','minutes','setup'].forEach(v => { $('v-'+v).hidden = S.view !== v; });
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.v === S.view));
  renderGame();
  if(S.view === 'plan') renderPlan();
  if(S.view === 'minutes') renderMinutes();
  if(S.view === 'setup') renderSetup();
  update();
}

// The big header scrolls away with the page; the slim bar shows once it is out of view.
if('IntersectionObserver' in window){
  new IntersectionObserver(([e]) => { $('mini').hidden = e.isIntersecting; }, {threshold:0}).observe(document.querySelector('.clockrow'));
}
// Full screen where the browser supports it (not on iPhone).
if(document.fullscreenEnabled && document.documentElement.requestFullscreen){
  $('fsbtn').hidden = false;
  document.addEventListener('fullscreenchange', () => { $('fsbtn').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; });
}
show();
setInterval(tick, 250);
setInterval(save, 5000);
})();
</script>

<script>
// Keep a copy on the phone so the app opens and runs with no connection.
if('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
</script>
