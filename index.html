<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Line Swap Clock</title>
<meta name="theme-color" content="#1590CC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Swap Clock">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.SWAP_OFFLINE = true;</script>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow sideline column — sticky match clock on top, one card per swap line below */
:root{
  --bg:#EDF2F6; --surface:#FFFFFF; --ink:#0E1D2A; --muted:#566878; --line:#D0DAE3;
  --accent:#1590CC; --accent-ink:#FFFFFF;
  --warn:#E89B00; --warn-soft:#FFF3D6; --due:#D11F3A; --due-soft:#FFE3E7; --ok:#18905F;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A151F; --surface:#122230; --ink:#E6EFF5; --muted:#8EA2B3; --line:#23394B;
  --accent:#44B6EA; --accent-ink:#03121D;
  --warn:#FFBE3B; --warn-soft:#3A2D0E; --due:#FF5C72; --due-soft:#3D1620; --ok:#3CCB8F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A151F; --surface:#122230; --ink:#E6EFF5; --muted:#8EA2B3; --line:#23394B;
  --accent:#44B6EA; --accent-ink:#03121D;
  --warn:#FFBE3B; --warn-soft:#3A2D0E; --due:#FF5C72; --due-soft:#3D1620; --ok:#3CCB8F; color-scheme:dark}

html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.4}
*{box-sizing:border-box}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:relative;background:var(--surface);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px)) 12px}
/* slim bar that takes over once the big header has scrolled away */
.mini{position:fixed;left:0;right:0;top:0;z-index:6;display:flex;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 6px) max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));box-shadow:0 2px 8px rgba(0,0,0,.08)}
.mini .mclock{font-family:var(--display);font-weight:700;font-size:24px;line-height:1}
.mini .mq{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mini .mnext{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mgo{border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;padding:8px 14px;flex:none}
.mini .mgo.pause{background:var(--ink);color:var(--surface)}
.tabs{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto}
.tab{border:0;background:transparent;padding:6px 10px;border-radius:6px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.clockrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.clock{font-family:var(--display);font-weight:700;font-size:56px;line-height:.9;letter-spacing:.01em}
.qlabel{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.clockmeta{display:flex;flex-direction:column;gap:4px}
.adj{display:flex;gap:4px}
.adj button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px 8px;font-size:13px;font-weight:600}
.go{margin-left:auto;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.05em;text-transform:uppercase;padding:14px 22px;min-width:130px}
.go.pause{background:var(--ink);color:var(--surface)}
.next{margin-top:10px;font-size:15px;color:var(--muted);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.next b{color:var(--ink)}
.next .clash{color:var(--due);font-weight:600}

.banner{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--warn-soft);border:1px solid var(--warn);font-weight:500}
.undo{margin-top:12px;display:flex;justify-content:flex-end}
.undo button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:14px;font-weight:600}

/* track cards */
.cards{display:grid;gap:12px;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-left:10px solid var(--tc);border-radius:12px;padding:12px 14px 14px;display:grid;gap:10px;transition:background .2s}
.card.soon{background:var(--warn-soft);border-color:var(--warn);border-left-color:var(--tc)}
.card.due{background:var(--due-soft);border-color:var(--due);border-left-color:var(--tc)}
.card.due .count{color:var(--due)}
@media (prefers-reduced-motion:no-preference){.card.due{animation:pulse 1s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--due)}}
.card-h{display:flex;align-items:center;gap:10px}
.chip{background:var(--tc);color:var(--tink);font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:5px}
.state{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card.soon .state{color:var(--warn)}.card.due .state{color:var(--due)}
.breaktag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:1px 6px}
.count{margin-left:auto;font-family:var(--display);font-weight:700;font-size:40px;line-height:1}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tc);width:0}
.swap{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.swap > div{min-width:0;display:flex;flex-direction:column;gap:2px}
.who{display:flex;gap:8px;align-items:center;min-width:0}
.av{width:80px;height:80px;border-radius:50%;object-fit:cover;flex:none;background:var(--bg);border:2px solid var(--tc,var(--line))}
.av.sm{width:34px;height:34px;border-radius:50%;border-width:1px}
.av.ph{display:inline-grid;place-items:center;font-weight:700;font-size:14px;color:var(--muted)}
.avbtn{cursor:pointer;display:block;line-height:0;border:0;background:none;padding:0}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
.avbtn .av{width:60px;height:60px}
.sq .av{width:60px;height:60px}
.import{background:var(--surface);border:1px dashed var(--accent);border-radius:12px;padding:12px 14px;margin-top:12px;display:grid;gap:8px}
.skips{display:flex;flex-wrap:wrap;gap:8px}
.squad{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.sq{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:0}
.sq input[type=text]{padding:6px 8px;font-size:15px}
.sq button{border:1px solid var(--line);background:var(--bg);border-radius:8px;height:34px;width:34px;flex:none}
.skip{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);width:56px;text-align:center}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.swap b{font-size:20px;font-weight:700;overflow-wrap:anywhere}
.in .lbl::before{content:"▲ ";color:var(--ok)}
.out .lbl::before{content:"▼ ";color:var(--due)}
.roster{display:flex;flex-wrap:wrap;gap:6px}
.pl{display:flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 3px;color:var(--muted)}
.pl .o{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--bg);color:var(--ink);font-weight:700;font-size:12px}
.pl.bench{border-color:var(--tc);color:var(--ink);font-weight:600}
.pl.bench .o{background:var(--tc);color:var(--tink)}
.btn-swap{border:0;border-radius:10px;padding:14px;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase;background:var(--bg);color:var(--ink);border:2px solid var(--line)}
.card.soon .btn-swap{border-color:var(--warn)}
.card.due .btn-swap{background:var(--due);border-color:var(--due);color:#fff}
.card.called{border-color:var(--accent);border-left-color:var(--tc)}
.card.called .state,.card.called .count{color:var(--accent)}
.card.called .btn-swap{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.subrow{display:flex;gap:6px;flex-wrap:wrap}
.subrow .btn-sub{padding:8px 12px}
.btn-swap.armed,.btn-sub.armed{background:var(--warn);border-color:var(--warn);color:#111}
.btn-swap:disabled{opacity:.55;cursor:not-allowed}
.cardrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;font-weight:600}
.cchip{width:14px;height:18px;border-radius:2px;display:inline-block;flex:none;border:1px solid rgba(0,0,0,.2)}
.cchip.green{background:#1E9E4A}.cchip.yellow{background:#F5C400}.cchip.red{background:#D7262F}
.cardbtn.green{border-color:#1E9E4A}.cardbtn.yellow{border-color:#F5C400}.cardbtn.red{border-color:#D7262F}
.inj.cardp{border-color:var(--warn)}
.banner.practice{background:var(--bg);border-color:var(--accent)}
.fsbtn{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap;align-self:center}
.offline:not(.has-key) .needs-claude,.offline #syncstat{display:none!important}
.syncstat{margin-left:auto;align-self:center;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;padding-left:8px}
.syncstat[data-st="saved"]{color:var(--ok)}.syncstat[data-st="error"]{color:var(--due)}
.log{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;max-height:320px;overflow:auto}
.log li{display:flex;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:14px}
.log li span{color:var(--muted);flex:none;min-width:72px}
.reportbox{width:100%;min-height:180px;font:inherit;font-size:14px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-top:8px}
.matches{display:grid;gap:6px;margin-top:10px}
.match{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:12px;max-width:65ch}
.check input{width:20px;height:20px;flex:none;margin-top:2px}
.others{display:grid;gap:8px}
.prow.orow{grid-template-columns:60px 1fr 116px 34px}
.inj{display:grid;gap:8px;padding:10px;border-radius:10px;background:var(--bg);border:1px solid var(--due)}
.injrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;font-weight:600;color:var(--due)}
.injrow .btn-sub{padding:6px 10px}
.pl.inj{text-decoration:line-through;opacity:.6;background:none;border-color:var(--line)}
.btn-sub{border:2px solid var(--line);background:transparent;border-radius:10px;padding:0 14px;font-weight:600;font-size:14px;color:var(--muted)}

/* plan */
h2{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;margin:22px 0 6px;text-wrap:balance}
p.lead{margin:0 0 12px;color:var(--muted);max-width:65ch}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:120px}
.stat b{display:block;font-family:var(--display);font-size:26px;line-height:1.1}
.stat.bad b{color:var(--due)}.stat.good b{color:var(--ok)}
.planbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto}
.planbox svg{display:block;width:100%;min-width:560px;height:auto}
.planbox text{fill:var(--muted);font-family:var(--body);font-size:13px}
.planbox .tn{fill:var(--ink);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--due);border-color:var(--due)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* minutes */
.tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:15px}
.tbl th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tbl td.r,.tbl th.r{text-align:right}
.tbl .sw{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--tc);margin-right:6px}
.tblwrap{overflow-x:auto}

/* setup */
.tset{background:var(--surface);border:1px solid var(--line);border-left:10px solid var(--tc);border-radius:12px;padding:12px 14px;margin-top:12px;display:grid;gap:10px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number]{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
select{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
.schedname{margin:12px 0 0;font-size:14px;color:var(--muted)}
.schedname b{color:var(--ink)}
input[type=color]{width:44px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:2px}
.prow{display:grid;grid-template-columns:20px 60px 1fr 60px 34px 34px;gap:6px;align-items:center}
.prow .o{font-family:var(--display);font-weight:700;font-size:20px;text-align:center}
.prow button{border:1px solid var(--line);background:var(--bg);border-radius:8px;height:40px}
.trow{display:grid;grid-template-columns:1fr 44px 120px;gap:8px;align-items:end}
.note{font-size:14px;color:var(--muted)}
.hdr{display:grid;grid-template-columns:20px 60px 1fr 60px 34px 34px;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hdr span:nth-child(1){text-align:center}
@media (max-width:420px){.prow,.hdr{grid-template-columns:20px 50px 1fr 56px 32px 32px}.prow.orow{grid-template-columns:50px 1fr 104px 32px}.avbtn .av,.sq .av{width:50px;height:50px}.swap .who{flex-direction:column;align-items:flex-start;gap:4px}}
@media (max-width:420px){.clock{font-size:46px}.go{min-width:0;padding:12px 16px;font-size:19px}.count{font-size:34px}}
</style>

<div class="wrap">
  <div class="top">
    <div class="tabs" role="tablist">
      <button class="tab" data-act="tab" data-v="game" role="tab">Game</button>
      <button class="tab" data-act="tab" data-v="plan" role="tab">Plan</button>
      <button class="tab" data-act="tab" data-v="minutes" role="tab">Minutes</button>
      <button class="tab" data-act="tab" data-v="setup" role="tab">Setup</button>
      <span class="syncstat" id="syncstat" data-st="local">On this phone only</span>
      <button class="fsbtn" id="fsbtn" data-act="fullscreen" hidden>Full screen</button>
    </div>
    <div class="clockrow">
      <div class="clockmeta">
        <span class="qlabel" id="qlabel">Q1</span>
        <span class="clock num" id="clock">0:00</span>
        <div class="adj"><button data-act="adj" data-d="-10">−10s</button><button data-act="adj" data-d="-1">−1s</button><button data-act="adj" data-d="1">+1s</button><button data-act="adj" data-d="10">+10s</button></div>
      </div>
      <button class="go" id="go" data-act="go">Start</button>
    </div>
    <div class="next num" id="next"></div>
    <div class="mini" id="mini" hidden><span class="mq" id="mq">Q1</span><span class="mclock num" id="mclock">0:00</span><span class="mnext num" id="mnext"></span><button class="mgo" id="mgo" data-act="go">Start</button></div>
  </div>

  <section id="v-game"></section>
  <section id="v-plan" hidden></section>
  <section id="v-minutes" hidden></section>
  <section id="v-setup" hidden></section>
</div>

<script>
(function(){
const LS = 'lineSwapClock.v1';
const OFFLINE = !!window.SWAP_OFFLINE; // set by the installable offline build
if(OFFLINE) document.documentElement.classList.add('offline');
let db = null, dl = null, applyingRemote = false;
const sync = {last:{}, ready:false, running:false, dirty:false, timer:null, got:new Set(), status:'local'};
const CLASH = 30;      // seconds: two lines swapping closer than this is a clash
const SOON = 30;       // seconds: heads-up before a swap
const BREAK_PULL = 120;// seconds: at a quarter break, offer swaps due this soon into the next quarter

// Example schedule read from the BRAX – LEOP board. Big number = bench minutes, order = small number.
const DEFAULT_SETUP = {
  quarterMin: 17.5, quarters: 4,
  tracks: [
    {id:'red',    name:'Red',    color:'#E3262B', offset:0, players:[{name:'Red 1',bench:3},{name:'Red 2',bench:3},{name:'Red 3',bench:3}]},
    {id:'pink',   name:'Pink',   color:'#E8408F', offset:0, players:[{name:'Loui',bench:6},{name:'Pink 2',bench:4}]},
    {id:'yellow', name:'Yellow', color:'#F2CE00', offset:0, players:[{name:'Yellow 1',bench:4},{name:'Yellow 2',bench:2},{name:'Yellow 3',bench:2},{name:'Yellow 4',bench:2}]},
    {id:'blue',   name:'Blue',   color:'#155489', offset:0, players:[{name:'Blue 1',bench:3},{name:'Blue 2',bench:3},{name:'Blue 3',bench:2},{name:'Blue 4',bench:2}]}
  ]
};

const clone = o => JSON.parse(JSON.stringify(o));
function newGame(setup){
  const tr = {}, acc = {};
  setup.tracks.forEach(t => {
    tr[t.id] = {benchIdx:0, benchSince:0, extra:+t.offset||0, swaps:[], alert:{}, called:null};
    acc[t.id] = t.players.map(() => 0);
  });
  return {phase:'pre', clockBase:0, runStart:null, quarter:1, tr, acc, history:[], log:[], speed:1};
}
function load(){
  try{ const s = JSON.parse(localStorage.getItem(LS));
    if(s && s.game){
      if(!s.schedules && s.setup){ if(+s.setup.quarterMin === 15) s.setup.quarterMin = 17.5; s.schedules = [{id:'s1', name:'BRAX - LEOP', setup:s.setup}]; s.activeId = 's1'; delete s.setup; }
      if(s.schedules && s.schedules.length) return s;
    } }catch(e){}
  return null;
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} queueSync(); }

const LOADED = load(), FRESH = !LOADED;
let S = LOADED || {schedules:[{id:'s1', name:'BRAX - LEOP', setup:clone(DEFAULT_SETUP)}], activeId:'s1', game:newGame(DEFAULT_SETUP), view:'game'};
S.matches = S.matches || []; S.settings = Object.assign({confirm:true}, S.settings);
if(!S.game.log) S.game.log = [];
const sched = () => S.schedules.find(x => x.id === S.activeId) || S.schedules[0];
const G = () => S.game, U = () => sched().setup;

// ---------- squad: one entry per real person, linking a face to a name across schedules ----------
function uid(){ return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function isRealName(n){ n = String(n || '').trim(); return !!n && !/^\S+ \d+$/.test(n); }
function allPlayers(){ const out = []; S.schedules.forEach(sc => { sc.setup.tracks.forEach(t => t.players.forEach(p => out.push(p))); (sc.others || []).forEach(p => out.push(p)); }); return out; }
// Schedules saved online point at the squad photo instead of repeating it ('@squad').
function photoOf(p){ return p.photo === '@squad' ? ((S.squad && S.squad[p.pid] && S.squad[p.pid].photo) || '') : (p.photo || ''); }
function squadByName(nm, except){ nm = String(nm).trim().toLowerCase(); return Object.keys(S.squad).find(k => k !== except && S.squad[k].name.trim().toLowerCase() === nm); }
function ensureSquad(){
  S.squad = S.squad || {};
  allPlayers().forEach(p => {
    if(p.pid) return;
    const hit = isRealName(p.name) && squadByName(p.name);
    p.pid = hit || uid();
    if(!hit && isRealName(p.name)) S.squad[p.pid] = {name:p.name.trim(), photo:p.photo || ''};
  });
}
// Called when a player's name is committed: link the face to that name everywhere.
function couple(p){
  ensureSquad();
  if(!isRealName(p.name)) return;
  const nm = p.name.trim(), other = squadByName(nm, p.pid);
  if(other){
    const old = p.pid;
    allPlayers().forEach(q => { if(q.pid === old){ q.pid = other; q.name = S.squad[other].name; } });
    if(!S.squad[other].photo && p.photo) S.squad[other].photo = p.photo;
    addSig(S.squad[other], p.sig); delete p.sig;
    delete S.squad[old];
  } else {
    const prev = S.squad[p.pid];
    S.squad[p.pid] = {name:nm, photo:(prev && prev.photo) || p.photo || '', sigs:(prev && prev.sigs) || []};
    addSig(S.squad[p.pid], p.sig); delete p.sig;
    allPlayers().forEach(q => { if(q.pid === p.pid) q.name = nm; });
  }
}
ensureSquad();
// The running game must belong to the schedule in use. If they don't match (for example the live game
// arrived from another phone before its schedule did), switch to the schedule the game belongs to,
// or start a fresh game when none fits, instead of drawing a game that doesn't fit and crashing.
function ensureGameFits(){
  const g = S.game, fits = sc => sc && sc.setup.tracks.length && sc.setup.tracks.every(t => g && g.tr && g.tr[t.id] && g.acc && g.acc[t.id] && g.acc[t.id].length === t.players.length);
  if(!sched().setup.tracks.length || fits(sched())) return false;
  const owner = S.schedules.find(fits);
  if(owner) S.activeId = owner.id; else S.game = newGame(U());
  return true;
}
// Two squad entries with the same name (one made on a phone before its online copy arrived) become one.
function mergeSquadDuplicates(){
  const byName = {};
  Object.keys(S.squad).forEach(k => { const n = String(S.squad[k].name || '').trim().toLowerCase(); if(n) (byName[n] = byName[n] || []).push(k); });
  Object.values(byName).forEach(ids => {
    if(ids.length < 2) return;
    const rank = k => (S.squad[k].photo ? 2 : 0) + ((S.squad[k].sigs || []).length ? 1 : 0);
    ids.sort((a, b) => rank(b) - rank(a));
    const keep = ids[0];
    ids.slice(1).forEach(k => { (S.squad[k].sigs || []).forEach(sg => addSig(S.squad[keep], sg)); allPlayers().forEach(p => { if(p.pid === k) p.pid = keep; }); delete S.squad[k]; });
  });
}
ensureGameFits();
// A squad member with a clean photo shows it everywhere. The board picture it replaces is kept once as
// that player's board-style reference ("ref"), which is what new boards get compared with.
function syncSquadPhotos(){
  let changed = false;
  allPlayers().forEach(p => {
    const sq = p.pid && S.squad[p.pid]; if(!sq) return;
    const ph = p.photo;
    if(ph && ph !== '@squad' && ph !== sq.photo && !sq.ref){ sq.ref = ph; changed = true; }
    if(sq.clean && sq.photo && ph !== '@squad' && ph !== sq.photo){ p.photo = sq.photo; changed = true; }
  });
  return changed;
}
syncSquadPhotos();

// ---------- time ----------
const qLen = () => Math.max(1, +U().quarterMin || 17.5) * 60;
const total = () => qLen() * Math.max(1, +U().quarters || 4);
function now(){ const g = G(); return g.clockBase + (g.runStart ? (Date.now() - g.runStart) / 1000 * (g.speed || 1) : 0); }
const qEnd = () => G().quarter * qLen();
function fmt(s){ s = Math.max(0, Math.floor(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
const benchMin = p => Math.max(0.25, +p.bench || 0);

function track(id){ return U().tracks.find(t => t.id === id); }
// The person filling a rotation spot right now: a reserve covering an injury, or the scheduled player.
function slot(t, k){ const s = G().tr[t.id], sub = s.subs && s.subs[k]; return sub ? {name:sub.name, photo:sub.photo, bench:t.players[k].bench, sub:true} : t.players[k]; }
// A carded bench player can't come on until the card is over; a red card on the bench stops the line.
function halted(s){ return s.benchIdx == null || !!(s.cards && s.cards[s.benchIdx] && s.cards[s.benchIdx].until == null); }
function due(t){
  const s = G().tr[t.id]; if(halted(s)) return Infinity;
  const base = s.benchSince + benchMin(t.players[s.benchIdx]) * 60 + (s.extra || 0), c = s.cards && s.cards[s.benchIdx];
  return c ? Math.max(base, c.until) : base;
}
// The player coming off is the next one in order who isn't off the field with a card.
function inOut(t){
  const s = G().tr[t.id], n = t.players.length; let o = (s.benchIdx + 1) % n;
  for(let j = 0; j < n && s.cards && s.cards[o] && o !== s.benchIdx; j++) o = (o + 1) % n;
  return {i:s.benchIdx, o};
}
function qtime(t){ const q = Math.min(Math.floor(t / qLen()) + 1, +U().quarters || 4); return `Q${q} ${fmt(t - (q - 1) * qLen())}`; }
function logEv(text){ const g = G(); g.log = g.log || []; g.log.push({t:Math.min(now(), total()), text}); if(g.log.length > 400) g.log.shift(); }

// ---------- sound / buzz / screen ----------
let ac = null, wake = null;
function ensureAudio(){ try{ ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume && ac.resume(); }catch(e){} }
function beep(n, f){
  if(!ac) return;
  try{ for(let k=0;k<n;k++){ const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + k*0.22;
    o.frequency.value = f; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.4,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.16);
    o.start(t0); o.stop(t0+0.18); } }catch(e){}
}
// Vibrate where the browser allows it. iPhones ignore navigator.vibrate, but Safari gives a small
// haptic tick when a switch-style checkbox is toggled, so fall back to toggling a hidden one.
let hapticEl = null;
function hapticTick(){
  try{
    if(!hapticEl){ hapticEl = document.createElement('label'); hapticEl.className = 'vh'; hapticEl.setAttribute('aria-hidden', 'true');
      const i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch', ''); i.tabIndex = -1; hapticEl.appendChild(i); document.body.appendChild(hapticEl); }
    hapticEl.click();
  }catch(e){}
}
function canVibrate(){ return typeof navigator.vibrate === 'function'; }
function buzz(p){
  let ok = false; try{ ok = canVibrate() && navigator.vibrate(p); }catch(e){}
  if(!ok){ const n = Array.isArray(p) ? Math.ceil(p.length / 2) : 1; for(let i = 0; i < n; i++) setTimeout(hapticTick, i * 220); }
}
async function keepAwake(){ try{ if(navigator.wakeLock && !wake){ wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>{wake=null}); } }catch(e){} }
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && G().phase === 'live') keepAwake(); });

// ---------- actions ----------
function go(){
  ensureAudio(); keepAwake();
  const g = G();
  if(g.phase === 'live'){ g.clockBase = now(); g.runStart = null; g.phase = 'paused'; }
  else if(g.phase === 'final') return;
  else {
    const fresh = g.phase === 'pre' || g.phase === 'break';
    if(g.phase === 'break') g.quarter++;
    g.runStart = Date.now(); g.phase = 'live';
    if(fresh) logEv(`Q${g.quarter} started`);
  }
  save(); renderGame(); update();
}
function adj(d){
  const g = G(), lo = (g.quarter-1)*qLen(), t = Math.min(qEnd(), Math.max(lo, now() + d));
  g.clockBase = t; if(g.runStart) g.runStart = Date.now();
  save(); update();
}
function swap(id){
  const t = track(id), g = G(), s = g.tr[id], at = Math.min(now(), total());
  if(halted(s) || (s.cards && s.cards[s.benchIdx])) return;
  const {i, o} = inOut(t); if(i === o) return;
  g.history.push({id, s:clone(s), acc:clone(g.acc[id])});
  if(g.history.length > 40) g.history.shift();
  g.acc[id][i] += at - s.benchSince;
  const wait = s.called != null ? at - s.called : 0;
  s.swaps.push({t:at, in:i, out:o, wait});
  logEv(`${t.name}: ${slot(t, i).name} on for ${slot(t, o).name}${s.called != null ? ` (took ${fmt(wait)} after the call)` : ''}`);
  s.benchIdx = o; s.benchSince = at; s.extra = 0; s.alert = {}; s.called = null;
  ensureAudio(); save(); renderGame(); update();
}
// Calling a swap stops that line's timer until the players have actually changed.
function callSwap(id){ const s = G().tr[id]; if(halted(s)) return; s.called = Math.min(now(), total()); ensureAudio(); save(); renderGame(); update(); }
function cancelCall(id){ G().tr[id].called = null; save(); renderGame(); update(); }
function undo(){
  const g = G(), h = g.history.pop(); if(!h) return;
  if(h.multi){ h.multi.forEach(x => { g.tr[x.id] = x.s; g.acc[x.id] = x.acc; }); g.resetAt = h.resetAt; }
  else { g.tr[h.id] = h.s; g.acc[h.id] = h.acc; }
  logEv(`Undid the last ${h.multi ? 'line-up reset' : (h.label || 'swap')}`);
  save(); renderGame(); update();
}
// Quarter break: every line goes back to its starting line-up (player 1 on the bench), timers restart now.
function resetLines(){
  const g = G(), at = Math.min(now(), total());
  g.history.push({multi: U().tracks.map(t => ({id:t.id, s:clone(g.tr[t.id]), acc:clone(g.acc[t.id])})), resetAt:g.resetAt});
  U().tracks.forEach(t => {
    const s = g.tr[t.id];
    if(s.benchIdx == null) return; // a line short through injury keeps playing as it is
    g.acc[t.id][s.benchIdx] += Math.max(0, at - s.benchSince);
    Object.assign(s, {benchIdx:0, benchSince:at, extra:+t.offset || 0, alert:{}, called:null});
  });
  g.resetAt = g.quarter;
  logEv('All lines reset to the starting line-up');
  save(); renderGame(); update();
}

function tick(){
  const g = G();
  if(g.phase === 'live' && now() >= qEnd()){
    g.clockBase = qEnd(); g.runStart = null;
    g.phase = g.quarter >= (+U().quarters || 4) ? 'final' : 'break';
    logEv(g.phase === 'final' ? 'Full time' : `End of Q${g.quarter}`);
    beep(2, 520); buzz([500]); save(); renderGame();
  }
  // Cards run on the game clock; a player whose card is over goes straight back into the rotation.
  const tc = now(); let back = false;
  U().tracks.forEach(t => { const s = g.tr[t.id];
    Object.keys(s.cards || {}).forEach(k => { const c = s.cards[k]; k = +k;
      if(c.until == null || tc < c.until) return;
      if(k !== s.benchIdx) g.acc[t.id][k] += c.until - c.at;
      delete s.cards[k]; back = true;
      logEv(`${t.name}: ${slot(t, k).name} back on after a ${c.type === 'green' ? 'green' : 'yellow'} card`);
    }); });
  if(back){ beep(2, 660); buzz([200,100,200]); save(); renderGame(); }
  if(g.phase === 'live'){
    const t0 = now();
    U().tracks.forEach(t => {
      const s = g.tr[t.id], rem = due(t) - t0;
      if(s.called != null || !isFinite(rem)) return;
      if(rem <= SOON && rem > 0 && !s.alert.soon){ s.alert.soon = 1; beep(1, 880); buzz(200); }
      if(rem <= 0 && !s.alert.due){ s.alert.due = 1; s.alert.re = Date.now(); beep(3, 1040); buzz([300,120,300,120,300]); }
      // Keep nagging every 15 s (up to 4 times) while a swap is overdue and not yet called.
      else if(rem <= 0 && s.alert.due && (s.alert.n || 0) < 4 && Date.now() - (s.alert.re || 0) > 15000){ s.alert.re = Date.now(); s.alert.n = (s.alert.n || 0) + 1; beep(2, 1040); buzz([300,120,300]); }
    });
  }
  update();
}

// ---------- game view ----------
const $ = id => document.getElementById(id);
function inkFor(hex){ const h = hex.replace('#',''); const r=parseInt(h.substr(0,2),16), gg=parseInt(h.substr(2,2),16), b=parseInt(h.substr(4,2),16);
  return (0.299*r + 0.587*gg + 0.114*b) > 160 ? '#111' : '#fff'; }
const tvars = t => `--tc:${t.color};--tink:${inkFor(t.color)}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderGame(){
  const g = G(), last = g.history[g.history.length-1];
  let banner = '';
  if(g.phase === 'break') banner = g.resetAt === g.quarter
    ? `<div class="banner">End of Q${g.quarter}. All lines are back to the starting line-up: number 1 of each line on the bench, timers start with Q${g.quarter+1}.</div>`
    : `<div class="banner">End of Q${g.quarter}. Lines marked “do at break” are due in the first ${BREAK_PULL/60} min of Q${g.quarter+1}, so swap them now while play is stopped. Or start Q${g.quarter+1} from the starting line-up:
        <div class="row" style="margin-top:10px"><button class="btn primary" data-act="resetlines">Reset to starting line-up</button></div></div>`;
  if(g.phase === 'final') banner = `<div class="banner">Full time. ${g.practice ? 'Practice run finished.' : 'Open the Minutes tab to send the report and add this match to the season log.'}</div>`;
  if(g.phase === 'pre') banner = `<div class="banner">Ready for push-back. Tap <b>Start</b> when the umpire starts the clock. Bench timers run on the game clock, so pausing for a stoppage pauses them too. When you give the swap command, tap <b>Call swap</b>: that line’s timer stops until you tap <b>Swap done</b>.
      <div class="row" style="margin-top:10px"><button class="btn" data-act="practice">Practice run at 10× speed</button></div></div>`;
  if(g.practice) banner = `<div class="banner practice">Practice run at ${g.speed}× speed. A 17:30 quarter takes under 2 minutes. Nothing here goes into the season log.
      <div class="row" style="margin-top:10px"><button class="btn" data-act="endpractice">End practice</button></div></div>` + (g.phase === 'break' || g.phase === 'final' ? banner : '');
  const cards = U().tracks.map(t => {
    const s = g.tr[t.id], inj = s.injured || [], subs = s.subs || {}, crd = s.cards || {}, stop = halted(s);
    const io = stop ? null : inOut(t), benchCard = !stop && crd[s.benchIdx];
    const roster = t.players.map((p, k) => { const sp = slot(t, k), c = crd[k];
      return `<span class="pl ${k===s.benchIdx?'bench':''} ${inj.includes(k)||c?'inj':''}"><span class="o">${k+1}</span>${photoOf(sp)?`<img class="av sm" src="${photoOf(sp)}" alt="">`:''}${esc(sp.name)} · ${+p.bench}′${k===s.benchIdx?' · bench':''}${inj.includes(k)?' · injured':''}${c?` · ${c.type==='red'?'red':c.type==='green'?'green':'yellow'} card`:''}</span>`; }).join('');
    const outs = inj.map(k => `<div class="injrow">${esc(slot(t, k).name)} is injured <button class="btn-sub" data-act="back" data-id="${t.id}" data-k="${k}">Back on</button></div>`)
      .concat(Object.keys(subs).map(k => `<div class="injrow">${esc(subs[k].name)} is in for ${esc(t.players[k].name)} <button class="btn-sub" data-act="back" data-id="${t.id}" data-k="${k}">${esc(t.players[k].name)} is back</button></div>`))
      .concat(Object.keys(crd).map(k => { const c = crd[k];
        return `<div class="cardrow"><span class="cchip ${c.type === 'red' ? 'red' : c.type === 'green' ? 'green' : 'yellow'}"></span>${esc(slot(t, +k).name)} ${c.until == null ? 'is sent off for the rest of the game' : `is off with a card · back in <b class="num" data-until="${c.until}">${fmt(c.until - now())}</b>`}</div>`; })).join('');
    let mid;
    if(stop) mid = `<p class="note">${s.benchIdx == null ? 'No one on this line’s bench, so everyone left plays on. The rotation restarts when the injured player is back, or bring in a reserve.' : 'The bench player is sent off, so the rest of this line plays on without swaps.'}</p>`;
    else mid = `<div class="swap"><div class="in"><span class="lbl">In</span><div class="who">${av(slot(t, io.i))}<b>${esc(slot(t, io.i).name)}</b></div></div><div class="out"><span class="lbl">Out</span><div class="who">${av(slot(t, io.o))}<b>${esc(slot(t, io.o).name)}</b></div></div></div>`
      + (benchCard ? `<p class="note">${esc(slot(t, s.benchIdx).name)} can’t come on until the card is over.</p>` : '');
    const sub = [];
    if(!stop && s.called == null) sub.push(`<button class="btn-sub" data-act="swap" data-id="${t.id}">Already swapped</button>`);
    if(!stop && s.called != null) sub.push(`<button class="btn-sub" data-act="cancel" data-id="${t.id}">Cancel call</button>`);
    sub.push(`<button class="btn-sub" data-act="injopen" data-id="${t.id}">Injury</button>`, `<button class="btn-sub" data-act="cardopen" data-id="${t.id}">Card</button>`);
    const main = stop ? '' : s.called != null
      ? `<button class="btn-swap" data-act="swap" data-id="${t.id}">Swap done</button>`
      : `<button class="btn-swap" data-act="call" data-id="${t.id}" data-f="btn">Call swap</button>`;
    return `<article class="card" data-card="${t.id}" style="${tvars(t)}">
      <div class="card-h"><span class="chip">${esc(t.name)}</span><span class="state" data-f="state"></span><span class="breaktag" data-f="bt" hidden>Do at break</span><span class="count num" data-f="count"></span></div>
      <div class="bar"><i data-f="bar"></i></div>
      ${mid}
      <div class="roster">${roster}</div>
      ${outs}
      ${injUI && injUI.id === t.id ? injPanel(t, s) : ''}
      ${cardUI && cardUI.id === t.id ? cardPanel(t, s) : ''}
      ${main}
      <div class="subrow">${sub.join('')}</div>
    </article>`;
  }).join('');
  const undoTxt = last ? (last.multi ? 'Undo line-up reset' : `Undo last ${last.label || 'swap'} (${esc(track(last.id)?.name || '')})`) : '';
  const res = (sched().others || []).filter(o => isRealName(o.name)).map(o => o.name);
  const names = [...new Set(res.concat(Object.values(S.squad || {}).map(x => x.name)))];
  $('v-game').innerHTML = `<p class="schedname">Schedule: <b>${esc(sched().name)}</b></p>` + banner + (last ? `<div class="undo"><button data-act="undo">${undoTxt}</button></div>` : '')
    + `<div class="cards">${cards}</div><datalist id="squadnames">${names.map(n => `<option value="${esc(n)}"></option>`).join('')}</datalist>`;
}

// ---------- cards ----------
let cardUI = null; // {id, k}: the line whose card panel is open, and who got the card
const CARD_TYPES = [['green', 'Green · 2 min', 2], ['yellow5', 'Yellow · 5 min', 5], ['yellow10', 'Yellow · 10 min', 10], ['red', 'Red · rest of game', null]];
function cardPanel(t, s){
  const crd = s.cards || {}, inj = s.injured || [];
  if(cardUI.k == null){
    const ks = t.players.map((p, k) => k).filter(k => !inj.includes(k) && !crd[k]);
    return `<div class="inj cardp"><b>Who got the card?</b><div class="row">${ks.map(k => `<button class="btn" data-act="cardpick" data-id="${t.id}" data-k="${k}">${esc(slot(t, k).name)}</button>`).join('')}</div>
      <div class="row"><button class="btn" data-act="cardclose">Cancel</button></div></div>`;
  }
  const k = cardUI.k;
  return `<div class="inj cardp"><b>${esc(slot(t, k).name)} gets a…</b>
    <div class="row">${CARD_TYPES.map(([id, label]) => `<button class="btn cardbtn ${id.replace(/\d+/, '')}" data-act="cardgive" data-id="${t.id}" data-k="${k}" data-type="${id}">${label}</button>`).join('')}</div>
    <p class="note">The line plays a player short. When the time is up you’ll hear a beep and the player goes straight back into the rotation.</p>
    <div class="row"><button class="btn" data-act="cardclose">Cancel</button></div></div>`;
}
function giveCard(id, k, type){
  const g = G(), s = g.tr[id], t = track(id), at = Math.min(now(), total());
  const def = CARD_TYPES.find(c => c[0] === type); if(!def) return;
  g.history.push({id, s:clone(s), acc:clone(g.acc[id]), label:'card'});
  s.cards = s.cards || {}; s.cardLog = s.cardLog || [];
  s.cards[k] = {type: type.replace(/\d+/, ''), at, until: def[2] == null ? null : at + def[2] * 60};
  s.cardLog.push({k, at, type:def[1], name:slot(t, k).name});
  if(s.called != null && inOut(t).o === k) s.called = null;
  logEv(`${t.name}: ${slot(t, k).name} ${def[2] == null ? 'red card' : def[1].toLowerCase().replace(' · ', ' card, ')}`);
  cardUI = null; save(); renderGame(); update();
}

// ---------- injuries ----------
let injUI = null; // {id, k}: the line whose injury panel is open, and who is hurt
function injPanel(t, s){
  if(injUI.k == null){
    const ks = t.players.map((p, k) => k).filter(k => !(s.injured || []).includes(k));
    return `<div class="inj"><b>Who is injured?</b><div class="row">${ks.map(k => `<button class="btn" data-act="injpick" data-id="${t.id}" data-k="${k}">${esc(slot(t, k).name)}</button>`).join('')}</div>
      <div class="row"><button class="btn" data-act="injclose">Cancel</button></div></div>`;
  }
  const k = injUI.k, nm = esc(slot(t, k).name);
  const benchOpt = s.benchIdx === k ? 'Line plays on without a bench'
    : s.benchIdx != null ? `${esc(slot(t, s.benchIdx).name)} comes on now` : 'Mark injured (no one on the bench)';
  return `<div class="inj"><b>${nm} is injured. How do you cover?</b>
    <div class="row"><button class="btn primary" data-act="injbench" data-id="${t.id}" data-k="${k}">${benchOpt}</button></div>
    <div class="row"><input type="text" id="res-${t.id}" list="squadnames" placeholder="Reserve’s name" aria-label="Reserve’s name" style="flex:1 1 140px;width:auto">
      <button class="btn" data-act="injres" data-id="${t.id}" data-k="${k}">Reserve takes ${nm}’s spot</button></div>
    <div class="row"><button class="btn" data-act="injclose">Cancel</button></div></div>`;
}
function injure(id, k, mode, resName){
  const g = G(), s = g.tr[id], t = track(id), at = Math.min(now(), total());
  g.history.push({id, s:clone(s), acc:clone(g.acc[id]), label:'injury'});
  s.subs = s.subs || {}; s.injured = s.injured || []; s.injAt = s.injAt || {};
  const hurt = slot(t, k).name;
  s.injLog = s.injLog || []; s.injLog.push({k, at, name:hurt});
  if(mode === 'reserve'){
    // The reserve steps into the injured player's spot; the rotation carries on unchanged.
    const nm = String(resName || '').trim() || 'Reserve', hit = squadByName(nm);
    s.subs[k] = {name: hit ? S.squad[hit].name : nm, photo: hit ? S.squad[hit].photo : '', pid: hit || null};
    logEv(`${t.name}: ${hurt} injured, reserve ${s.subs[k].name} takes the spot`);
  } else {
    if(s.benchIdx === k){ g.acc[id][k] += at - s.benchSince; }
    else if(s.benchIdx != null){ const b = s.benchIdx; g.acc[id][b] += at - s.benchSince; s.swaps.push({t:at, in:b, out:k, wait:0, injury:true});
      logEv(`${t.name}: ${hurt} injured, ${slot(t, b).name} comes on`); }
    if(s.benchIdx === k || s.benchIdx == null) logEv(`${t.name}: ${hurt} injured`);
    s.benchIdx = null; s.called = null; s.injured.push(k); s.injAt[k] = at;
  }
  injUI = null; save(); renderGame(); update();
}
function backOn(id, k){
  const g = G(), s = g.tr[id], at = Math.min(now(), total());
  g.history.push({id, s:clone(s), acc:clone(g.acc[id]), label:'return'});
  const t = track(id);
  if(s.subs && s.subs[k]){ logEv(`${t.name}: ${t.players[k].name} back, takes the spot from ${s.subs[k].name}`); delete s.subs[k]; }
  else if(s.injured && s.injured.includes(k)){
    logEv(`${t.name}: ${slot(t, k).name} back from injury`);
    s.injTot = s.injTot || {}; s.injTot[k] = (s.injTot[k] || 0) + at - s.injAt[k];
    g.acc[id][k] += at - s.injAt[k]; delete s.injAt[k];
    s.injured = s.injured.filter(x => x !== k);
    // Once the line is complete again, the returning player sits first and the rotation restarts.
    if(s.benchIdx == null && !s.injured.length){ s.benchIdx = k; s.benchSince = at; s.extra = 0; s.alert = {}; }
  }
  save(); renderGame(); update();
}

function update(){
  const g = G(), t0 = now();
  $('clock').textContent = fmt(t0 - (g.quarter-1)*qLen());
  $('qlabel').textContent = (g.practice ? `Practice ${g.speed}× · ` : '') + (g.phase === 'final' ? 'Full time' : g.phase === 'break' ? `End of Q${g.quarter}` : `Q${g.quarter} · ${fmt(t0)} total`);
  document.querySelectorAll('[data-until]').forEach(el => { el.textContent = fmt(+el.dataset.until - t0); });
  const gb = $('go');
  gb.textContent = g.phase === 'live' ? 'Pause' : g.phase === 'break' ? `Start Q${g.quarter+1}` : g.phase === 'paused' ? 'Resume' : g.phase === 'final' ? 'Done' : 'Start';
  gb.classList.toggle('pause', g.phase === 'live');
  const mg = $('mgo'); mg.textContent = gb.textContent; mg.classList.toggle('pause', g.phase === 'live');
  $('mclock').textContent = $('clock').textContent; $('mq').textContent = g.phase === 'break' || g.phase === 'final' ? $('qlabel').textContent : `Q${g.quarter}`;

  const stopped = U().tracks.filter(t => halted(g.tr[t.id]));
  const waiting = U().tracks.filter(t => g.tr[t.id].called != null && !halted(g.tr[t.id]));
  const list = U().tracks.filter(t => g.tr[t.id].called == null && !halted(g.tr[t.id])).map(t => ({t, rem: due(t) - t0})).sort((a,b) => a.rem - b.rem);
  const wtxt = waiting.length ? `<span class="clash" style="color:var(--accent)">Waiting: ${waiting.map(t => esc(t.name) + ' ' + fmt(t0 - g.tr[t.id].called)).join(', ')}</span> · ` : '';
  if(!list.length) $('next').innerHTML = wtxt;
  if(list.length){
    const a = list[0], b = list[1], io = inOut(a.t);
    let h = wtxt + `Next: <b>${esc(a.t.name)}</b> ${a.rem>0?'in '+fmt(a.rem):'now'} · ${esc(slot(a.t, io.i).name)} for ${esc(slot(a.t, io.o).name)}`;
    if(b && b.rem - a.rem < CLASH) h += ` <span class="clash">+ ${esc(b.t.name)} ${b.rem>0?fmt(b.rem):'now'}: close together, do one early</span>`;
    else if(b) h += ` · then ${esc(b.t.name)} ${fmt(b.rem)}`;
    $('next').innerHTML = h;
    $('mnext').textContent = `${a.t.name} ${a.rem > 0 ? fmt(a.rem) : 'now'}`;
  }

  if(S.view === 'game'){
    // Lines that were called sit on top, then the rest by how soon they swap.
    waiting.concat(list.map(x => x.t), stopped).forEach((t, k) => { const c = document.querySelector(`[data-card="${t.id}"]`); if(c) c.style.order = k; });
    U().tracks.forEach(t => {
      const card = document.querySelector(`[data-card="${t.id}"]`); if(!card) return;
      const s = g.tr[t.id], d = due(t), rem = d - t0;
      if(halted(s)){
        card.classList.remove('soon', 'due', 'called');
        card.querySelector('[data-f="state"]').textContent = 'Playing through';
        card.querySelector('[data-f="count"]').textContent = '–';
        card.querySelector('[data-f="bar"]').style.width = '0';
        card.querySelector('[data-f="bt"]').hidden = true;
        return;
      }
      const called = s.called != null;
      const soon = !called && rem <= SOON && rem > 0, isDue = !called && rem <= 0;
      card.classList.toggle('soon', soon); card.classList.toggle('due', isDue); card.classList.toggle('called', called);
      const f = n => card.querySelector(`[data-f="${n}"]`);
      const span = Math.max(1, d - s.benchSince);
      f('bar').style.width = Math.min(100, Math.max(0, ((called ? s.called : t0) - s.benchSince) / span * 100)) + '%';
      if(called){
        f('state').textContent = 'Called · waiting';
        f('count').textContent = fmt(t0 - s.called);
        f('bt').hidden = true;
        return;
      }
      const carded = s.cards && s.cards[s.benchIdx];
      f('state').textContent = carded && !isDue ? 'Bench player carded' : isDue ? (rem < -15 ? 'Overdue' : 'Swap now') : soon ? 'Get ready' : 'Next swap in';
      f('count').textContent = isDue ? '+' + fmt(-rem) : fmt(rem);
      f('bt').hidden = !(g.phase === 'break' && rem <= BREAK_PULL);
      const btn = f('btn'); if(btn){ btn.textContent = carded ? 'Waiting for card' : isDue || (g.phase === 'break' && rem <= BREAK_PULL) ? 'Call swap' : 'Call early'; btn.disabled = !!carded; }
    });
  }
  if(S.view === 'minutes' && (Date.now() % 1000) < 260) refreshMinutes();
}

// ---------- plan ----------
function simulate(setup, offsets){
  const T = Math.max(1, +setup.quarterMin || 17.5) * 60 * Math.max(1, +setup.quarters || 4);
  return setup.tracks.map((t, k) => {
    const out = []; let idx = 0, from = 0, extra = offsets ? offsets[k] : (+t.offset || 0);
    while(out.length < 400){ const d = from + benchMin(t.players[idx]) * 60 + extra; if(d >= T) break; out.push(d); from = d; extra = 0; idx = (idx + 1) % t.players.length; }
    return out;
  });
}
function clashInfo(times){
  const all = []; times.forEach((arr, k) => arr.forEach(x => all.push({x, k}))); all.sort((a,b) => a.x - b.x);
  let n = 0, minGap = Infinity; const bad = new Set();
  for(let j=1;j<all.length;j++){ if(all[j].k === all[j-1].k) continue; const gp = all[j].x - all[j-1].x;
    minGap = Math.min(minGap, gp); if(gp < CLASH){ n++; bad.add(all[j].k+':'+all[j].x); bad.add(all[j-1].k+':'+all[j-1].x); } }
  return {n, minGap, bad, count: all.length};
}
function autoStagger(){
  const tr = U().tracks, steps = tr.length > 5 ? [0,30,60,90] : [0,15,30,45,60,75,90];
  let best = null; const cur = new Array(tr.length).fill(0);
  (function rec(k){
    if(k === tr.length){ const c = clashInfo(simulate(U(), cur)); const sum = cur.reduce((a,b)=>a+b,0);
      const score = [c.n, -Math.min(c.minGap, 60), sum];
      if(!best || score[0]<best.s[0] || (score[0]===best.s[0] && (score[1]<best.s[1] || (score[1]===best.s[1] && score[2]<best.s[2])))) best = {s:score, o:cur.slice()};
      return; }
    for(const v of steps){ cur[k] = v; rec(k+1); }
  })(0);
  tr.forEach((t, k) => t.offset = best.o[k]);
  if(G().phase === 'pre') S.game = newGame(U());
  save(); renderPlan(); renderGame(); update();
}
function renderPlan(){
  const times = simulate(U()), c = clashInfo(times), T = total(), tr = U().tracks;
  const L = 86, R = 990, top = 26, lane = 38, H = top + lane * tr.length + 8;
  const X = s => L + (R - L) * s / T;
  let svg = `<svg viewBox="0 0 1000 ${H}" role="img" aria-label="Planned swaps per line across the match">`;
  for(let q=0;q<=(+U().quarters||4);q++){ const x = X(q*qLen());
    svg += `<line x1="${x}" x2="${x}" y1="18" y2="${H-4}" stroke="var(--line)" stroke-width="2" ${q>0&&q<(+U().quarters||4)?'stroke-dasharray="4 4"':''}/>`;
    if(q < (+U().quarters||4)) svg += `<text x="${X(q*qLen()+qLen()/2)}" y="14" text-anchor="middle">Q${q+1}</text>`; }
  tr.forEach((t, k) => { const y = top + k*lane;
    svg += `<text class="tn" x="0" y="${y+lane/2+4}">${esc(t.name)}</text>`;
    svg += `<line x1="${L}" x2="${R}" y1="${y+lane/2}" y2="${y+lane/2}" stroke="var(--line)" stroke-width="1"/>`;
    times[k].forEach(x => { const px = X(x), bad = c.bad.has(k+':'+x);
      svg += `<rect x="${px-2}" y="${y+7}" width="4" height="${lane-14}" rx="1" fill="${t.color}"/>`;
      if(bad) svg += `<circle cx="${px}" cy="${y+lane/2}" r="9" fill="none" stroke="var(--due)" stroke-width="2"/>`; });
  });
  svg += `</svg>`;
  $('v-plan').innerHTML = `
    <h2>Swap plan</h2>
    <p class="lead">Every planned swap across the match if each one happens on time. Red rings mark two lines swapping within ${CLASH} seconds of each other, which you can’t do alone. Auto-stagger delays the first swap of some lines by up to 90 seconds so the swaps spread out.</p>
    <div class="stats">
      <div class="stat"><span class="lbl">Swaps</span><b class="num">${c.count}</b></div>
      <div class="stat ${c.n?'bad':'good'}"><span class="lbl">Clashes</span><b class="num">${c.n}</b></div>
      <div class="stat"><span class="lbl">Closest gap</span><b class="num">${isFinite(c.minGap)?fmt(c.minGap):'–'}</b></div>
    </div>
    <div class="planbox">${svg}</div>
    <div class="row" style="margin-top:12px">
      <button class="btn primary" data-act="stagger" ${G().phase!=='pre'?'disabled':''}>Auto-stagger first swaps</button>
      <span class="note">${tr.map(t => `${esc(t.name)} +${+t.offset||0}s`).join(' · ')}</span>
    </div>
    ${G().phase!=='pre'?'<p class="note">Stagger is set before the game. During play, the Game tab warns you when two swaps come close.</p>':''}`;
}

const mins = s => Math.round(s / 6) / 10; // seconds → minutes with one decimal
// One row per person who played in this match, counted on the game clock.
function matchRows(){
  const g = G(), t0 = Math.min(now(), total()), rows = [];
  U().tracks.forEach(t => {
    const s = g.tr[t.id];
    t.players.forEach((p, k) => {
      const injNow = (s.injured || []).includes(k), c = (s.cards || {})[k];
      const cardOff = c && k !== s.benchIdx ? Math.max(0, Math.min(t0, c.until == null ? t0 : c.until) - c.at) : 0;
      const benched = g.acc[t.id][k] + (k === s.benchIdx && !injNow ? Math.max(0, t0 - s.benchSince) : 0) + (injNow ? Math.max(0, t0 - s.injAt[k]) : 0) + cardOff;
      const sp = slot(t, k), injured = ((s.injTot || {})[k] || 0) + (injNow ? Math.max(0, t0 - s.injAt[k]) : 0);
      rows.push({line:t.name, color:t.color, pid: sp.sub ? (sp.pid || squadByName(sp.name) || null) : (p.pid || null), name:sp.name,
        status: injNow ? 'Injured' : c ? 'Card' : k === s.benchIdx ? 'Bench' : 'Field',
        played: Math.max(0, t0 - benched), bench: benched, ins: s.swaps.filter(w => w.in === k).length,
        injured, cards: (s.cardLog || []).filter(x => x.k === k).map(x => x.type.split(' ·')[0])});
    });
  });
  (sched().others || []).filter(o => o.why === 'Full game').forEach(o => rows.push({line:'Full game', color:'#5BC8E8', pid:o.pid || null, name:o.name || 'Full-game player',
    status:'Field', played:t0, bench:0, ins:0, injured:0, cards:[]}));
  return rows;
}
function reportText(){
  const g = G(), rows = matchRows(), t0 = Math.min(now(), total());
  const head = `${sched().name} · ${new Date().toLocaleDateString()} · ${g.phase === 'final' ? 'full time' : 'at ' + qtime(t0)}`;
  const lines = [...new Set(rows.map(r => r.line))].map(l => `${l.toUpperCase()}\n` + rows.filter(r => r.line === l)
    .map(r => `  ${r.name}: ${fmt(r.played)} played${r.ins ? `, on ${r.ins}×` : ''}${r.injured ? `, injured ${fmt(r.injured)}` : ''}${r.cards.length ? `, ${r.cards.join(' + ')} card` : ''}`).join('\n'));
  const waits = U().tracks.flatMap(t => g.tr[t.id].swaps.filter(w => w.wait > 0).map(w => w.wait));
  const avgWait = waits.length ? ` Average time from call to swap: ${fmt(waits.reduce((a, b) => a + b, 0) / waits.length)}.` : '';
  return `${head}\n\n${lines.join('\n\n')}\n\n${U().tracks.reduce((a, t) => a + g.tr[t.id].swaps.length, 0)} swaps.${avgWait}`;
}

// ---------- face matching that ignores the printed numbers ----------
// Boards reuse the same headshots week to week; only the faded minutes digit (or an X) printed over
// them changes. So compare small grey thumbnails and score with the median pixel difference: the
// part a digit covers is outvoted by the rest of the photo. Small shifts and scales absorb crop wobble.
const SIG = 32, PAD = 4, CW = SIG + 2 * PAD, PHOTO_FR = 0.86;
function greyGrid(px, W, H, sx, sy, side, n){
  const out = new Float32Array(n * n), step = side / n;

    let sum = 0, cnt = 0;
    for(let yy = 0; yy < 3; yy++) for(let xx = 0; xx < 3; xx++){
      const x = Math.floor(sx + (gx + (xx + 0.5) / 3) * step), y = Math.floor(sy + (gy + (yy + 0.5) / 3) * step);
      if(x < 0 || y < 0 || x >= W || y >= H) continue;
      const i = (y * W + x) * 4; sum += 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]; cnt++;

}
function centred(a){ let m = 0; for(const v of a) m += v; m /= a.length; return a.map(v => v - m); }
// A reference: the photo area of one tile, as a 32×32 grey grid with its mean removed, packed to text.
function refSig(px, W, H, cx, cy, boxSide){
  const side = boxSide * PHOTO_FR, g = centred(greyGrid(px, W, H, cx - side / 2, cy - side / 2, side, SIG));
  let s = ''; for(const v of g) s += String.fromCharCode(Math.max(0, Math.min(255, Math.round(v + 128))));

// A candidate: a slightly larger area at three scales, so the reference can slide over it.
function candGrids(px, W, H, cx, cy, boxSide){
  return [0.88, 0.94, 1, 1.06, 1.12].map(k => { const side = boxSide * PHOTO_FR * k * CW / SIG; return greyGrid(px, W, H, cx - side / 2, cy - side / 2, side, CW); });
}
// Only pixels that differ from the shared light-blue backdrop say who someone is (face, hair, skin).
function prepRef(sig){
  const r = unpack(sig), h = new Uint32Array(64);
  for(const v of r) h[Math.max(0, Math.min(63, (v + 128) >> 2))]++;
  let peak = 0; for(let i = 1; i < 64; i++) if(h[i] > h[peak]) peak = i;
  const bg = peak * 4 - 128 + 2, idx = [];
  for(let i = 0; i < r.length; i++) if(Math.abs(r[i] - bg) > 14) idx.push(i);

}
const hist = new Uint32Array(512);
function medianOf(n){ let acc = 0; for(let b = 0; b < 512; b++){ acc += hist[b]; if(acc >= n / 2) return b; } return 511; }
// Robust distance: differences are re-centred on their median (lighting/brightness shifts), then the
// median absolute deviation is taken, so a digit covering under half the face does not count.
function scoreAt(ref, c, dx, dy, d){
  const {r, idx} = ref, n = idx.length; hist.fill(0);
  for(let k = 0; k < n; k++){ const i = idx[k], x = i % SIG, y = (i / SIG) | 0;
    const v = r[i] - c[(y + PAD + dy) * CW + PAD + dx + x]; d[k] = v; hist[Math.max(0, Math.min(511, Math.round(v) + 256))]++; }
  const med = medianOf(n) - 256; hist.fill(0);
  for(let k = 0; k < n; k++) hist[Math.min(511, Math.round(Math.abs(d[k] - med)))]++;
  return medianOf(n);
}
// Coarse search over every scale and every other shift, then refine around the best spot.
function score(ref, cands){
  const n = ref.idx.length; if(n < 60) return Infinity;
  const d = new Float32Array(n); let best = Infinity, bc = 0, bx = 0, by = 0;
  cands.forEach((c, ci) => { for(let dy = -PAD; dy <= PAD; dy += 2) for(let dx = -PAD; dx <= PAD; dx += 2){
    const v = scoreAt(ref, c, dx, dy, d); if(v < best){ best = v; bc = ci; bx = dx; by = dy; } } });
  for(let ci = Math.max(0, bc - 1); ci <= Math.min(cands.length - 1, bc + 1); ci++)
    for(let dy = Math.max(-PAD, by - 1); dy <= Math.min(PAD, by + 1); dy++) for(let dx = Math.max(-PAD, bx - 1); dx <= Math.min(PAD, bx + 1); dx++){
      const v = scoreAt(ref, cands[ci], dx, dy, d); if(v < best) best = v; }

}

    const sc = refs.map(rs => rs.length ? Math.min(...rs.map(r => score(r, t.cands))) : Infinity);
    const order = sc.map((v, j) => j).sort((a, b) => sc[a] - sc[b]);
    const b = order[0], second = order.length > 1 ? sc[order[1]] : Infinity;
    if(b != null && sc[b] <= limit && second - sc[b] >= gap) pairs.push({i, j:b, s:sc[b]});
  });

  const usedT = new Set(), usedP = new Set(), out = {};
  pairs.sort((a, b) => a.s - b.s).forEach(p => { if(usedT.has(p.i) || usedP.has(p.j)) return; usedT.add(p.i); usedP.add(p.j); out[p.i] = p.j; });

}

async function blobToBase64Jpeg(blob){

  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);

function parseJsonReply(text){

  try{ return JSON.parse(text); }catch(e){}
  const a = text.search(/[\[{]/), b = Math.max(text.lastIndexOf('}'), text.lastIndexOf(']'));
  if(a >= 0 && b > a) return JSON.parse(text.slice(a, b + 1));

function makeApiSample(){
  const fn = async () => { throw {code:'invalid_request'}; };
  fn.limits = async () => ({maxPromptBytes:262144, images:{maxCount:5, maxInputBytes:20e6, mediaTypes:['image/jpeg','image/png','image/webp']}});
  fn.json = async (prompt, opts = {}) => {
    if(!navigator.onLine) throw {code:'offline'};
    let client; try{ client = await apiClient(); }catch(e){ throw {code:'offline'}; }
    const imgs = opts.images ? [].concat(opts.images) : [];
    const content = [];
    for(const b of imgs) content.push({type:'image', source:{type:'base64', media_type:'image/jpeg', data: await blobToBase64Jpeg(b)}});
    content.push({type:'text', text: prompt + '\n\nReply with only the JSON, no other text.'});
    let res;
    try{
      res = await client.beta.messages.create({
        model:'claude-opus-5-5', max_tokens:16000,
        output_config:{effort:'high'},
        betas:['server-side-fallback-2026-07-01'], fallbacks:'default',
        messages:[{role:'user', content}]

    }catch(e){
      const E = sdkMod || {};
      if(E.APIUserAbortError && e instanceof E.APIUserAbortError) throw {code:'cancelled'};
      if(E.AuthenticationError && e instanceof E.AuthenticationError) throw {code:'bad_key'};
      if(E.PermissionDeniedError && e instanceof E.PermissionDeniedError) throw {code:'bad_key'};
      if(E.RateLimitError && e instanceof E.RateLimitError) throw {code:'rate_limited'};
      if(E.APIConnectionError && e instanceof E.APIConnectionError) throw {code:'offline'};
      throw {code:'upstream_error'};

}

  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.9));
  readCtl = new AbortController(); setReadMsg('Claude is reading the board. This can take up to a minute…'); renderSetup();
  try{
    const known = Object.keys(S.squad || {}).filter(k => S.squad[k].photo && isRealName(S.squad[k].name)).slice(0, 36).map(k => ({pid:k, name:S.squad[k].name, photo:S.squad[k].ref || S.squad[k].photo}));
    const lim = await sampleFn.limits().catch(() => null), images = [blob];
    let prompt = BOARD_PROMPT;

    const res = await sampleFn.json(prompt, {images, modelTier:'complex', signal:readCtl.signal});
    setReadMsg('Matching faces against your squad…');
    const pool = Object.keys(S.squad || {}).filter(k => isRealName(S.squad[k].name));
    for(const k of pool) if(!(S.squad[k].sigs || []).length && S.squad[k].photo) addSig(S.squad[k], await sigFromPhoto(S.squad[k].photo));
    let px = null; try{ px = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data; }catch(e){}

}
const SQUAD_PROMPT = `
The second image is the squad sheet: known players as they looked on earlier boards (some pictures may instead be studio photos on a dark background), each with a number in a black box at its top-left corner.
For every player on the board, add "squad": the number of the same person on the squad sheet, or null if they are not on it. Big faded numbers and X marks are printed over the photos on BOTH images. They change every week and are not part of the person: ignore them completely and compare only the person (face shape, hair, skin, eyebrows, smile). The same headshot photo is often reused, so the same person usually has the same pose and background. Only match when you are confident, and never use one squad number twice.`;
// Draw known players into one numbered grid image so one call can match faces.
async function squadSheet(entries, label){
  label = label || (i => String(i + 1));
  const cols = 6, T = 128, cv = document.createElement('canvas'), g = cv.getContext('2d');
  cv.width = cols * T; cv.height = Math.ceil(entries.length / cols) * T;
  g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
  await Promise.all(entries.map((e, i) => new Promise(res => { const im = new Image();
    im.onload = () => { g.drawImage(im, (i % cols) * T, Math.floor(i / cols) * T, T, T); res(); }; im.onerror = res; im.src = e.photo; })));
  entries.forEach((e, i) => { const x = (i % cols) * T, y = Math.floor(i / cols) * T;
    g.fillStyle = '#000'; g.fillRect(x, y, 36, 28); g.fillStyle = '#fff'; g.font = 'bold 22px sans-serif'; g.fillText(label(i), x + 5, y + 22); });
  return new Promise(r => cv.toBlob(r, 'image/jpeg', 0.9));
}
function buildFromBoard(res, cv, known, px, pool){
  known = known || []; pool = pool || [];
  const list = res && Array.isArray(res.players) ? res.players : [], W = cv.width, H = cv.height;
  // Photo matching first: it compares the headshots themselves and ignores the printed numbers.
  const tiles = list.map(p => {
    const bx = Array.isArray(p.box) && p.box.length >= 4 ? p.box.map(Number) : null; if(!bx || !px) return {};
    const cx = (bx[0] + bx[2] / 2) / 1000 * W, cy = (bx[1] + bx[3] / 2) / 1000 * H, side = Math.min(bx[2] / 1000 * W, bx[3] / 1000 * H);
    return side > 8 ? {cands:candGrids(px, W, H, cx, cy, side), sig:refSig(px, W, H, cx, cy, side)} : {};
  });
  const local = px && pool.length ? matchFaces(tiles, pool.map(k => S.squad[k]), 30, 4) : {};
  const taken = new Set(Object.values(local).map(j => pool[j]));
  const groups = {}, skipped = [], used = new Set(); let unsure = 0, matched = 0, byPhoto = 0;
  list.forEach((p, i) => {
    const crop = cropBox(cv, p.box); let photo = crop, name = p.name ? String(p.name).slice(0, 30) : '', pid = null;
    const col = String(p.color || 'none').toLowerCase().replace(/[^a-z]/g, ''), sn = Number(p.squad), sig = tiles[i].sig || null;
    if(local[i] != null){ pid = pool[local[i]]; matched++; byPhoto++; }
    else if(sn >= 1 && sn <= known.length && !used.has(sn) && !taken.has(known[sn - 1].pid)){ used.add(sn); pid = known[sn - 1].pid; taken.add(pid); matched++; }
    else if(isRealName(name) && squadByName(name) && !taken.has(squadByName(name))){ pid = squadByName(name); taken.add(pid); }
    if(pid && S.squad[pid]){ name = S.squad[pid].name; photo = S.squad[pid].photo || photo; addSig(S.squad[pid], sig); if(crop) S.squad[pid].ref = crop; }
    if(p.excluded){ skipped.push({photo, name, why:'Not playing', pid: pid || uid(), sig}); return; }
    if(FULL_GAME.includes(col)){ skipped.push({photo, name, why:'Full game', pid: pid || uid(), sig}); return; }
    if(col === 'none' || !col){ skipped.push({photo, name, why:'Reserve', pid: pid || uid(), sig}); return; }
    let bench = Number(p.bench); if(!(bench > 0)){ bench = 2; unsure++; }
    (groups[col] = groups[col] || []).push({name, bench, order:Number(p.order) || 99, photo, pid, sig});
  });
  const tracks = [];
  Object.keys(groups).forEach((col, k) => {
    const ps = groups[col];
    if(ps.length < 2){ ps.forEach(p => skipped.push({photo:p.photo, name:p.name, why:'Reserve', pid:p.pid || uid(), sig:p.sig})); return; }
    ps.sort((a, b) => a.order - b.order);
    const [label, hex] = LINE_COLORS[col] || [col[0].toUpperCase() + col.slice(1), '#6B7B8C'];
    tracks.push({id:'t' + Date.now() + k, name:label, color:hex, offset:0,
      players: ps.map((p, i) => ({name: p.name || `${label} ${i+1}`, bench:p.bench, photo:p.photo, pid:p.pid || uid(), sig:p.pid ? undefined : p.sig}))});
  });
  skipped.forEach(o => { if(S.squad[o.pid]) delete o.sig; });
  const title = res && res.title ? String(res.title).slice(0, 40) : 'Board ' + new Date().toLocaleDateString();
  return {name:title, unsure, matched, byPhoto, skipped, setup:{quarterMin:U().quarterMin, quarters:U().quarters, tracks}};
}

// ---------- clean headshots ----------
let cleanMsg = '', cleanPending = [];
// Read one headshot: a square from the top-middle of a portrait (where the face is), at 256 px for matching.
async function cleanItem(file){
  const img = await loadImg(file), w = img.naturalWidth, h = img.naturalHeight, side = Math.min(w, h);
  const sx = (w - side) / 2, sy = h > w ? Math.min((h - side) / 2, h * 0.06) : 0;
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); g.drawImage(img, sx, sy, side, side, 0, 0, 256, 256);
  const px = g.getImageData(0, 0, 256, 256).data;
  return {photo:squareFrom(c, 0, 0, 256), sig:refSig(px, 256, 256, 128, 128, 256 / PHOTO_FR), cands:candGrids(px, 256, 256, 128, 128, 256 / PHOTO_FR)};
}
function setSquadPhoto(pid, photo, sig){
  const sq = S.squad[pid]; if(!sq) return;
  sq.photo = photo; sq.clean = true; addSig(sq, sig);
  allPlayers().forEach(p => { if(p.pid === pid) p.photo = photo; });
}
function setCleanMsg(m){ cleanMsg = m; const el = $('cleanmsg'); if(el) el.textContent = m; }
async function cleanUpload(files){
  const pool = Object.keys(S.squad || {}).filter(k => isRealName(S.squad[k].name));
  if(!pool.length){ setCleanMsg('Name your players first (or upload a board), so the app knows who to match the photos to.'); return; }
  setCleanMsg(`Matching ${files.length} photo${files.length > 1 ? 's' : ''} to your squad…`);
  for(const k of pool) if(!(S.squad[k].sigs || []).length && S.squad[k].photo) addSig(S.squad[k], await sigFromPhoto(S.squad[k].photo));
  const items = []; for(const f of files){ try{ items.push(await cleanItem(f)); }catch(e){} }
  const local = matchFaces(items, pool.map(k => S.squad[k]), 30, 4), done = new Set(), usedP = new Set();
  Object.keys(local).forEach(i => { const pid = pool[local[i]]; setSquadPhoto(pid, items[i].photo, items[i].sig); done.add(+i); usedP.add(pid); });
  let rest = items.map((it, i) => i).filter(i => !done.has(i)), byClaude = 0;
  // Ask Claude to pair the rest by face: one sheet of the new photos (A, B, …), one of the squad (1, 2, …).
  const lim = sampleFn ? await sampleFn.limits().catch(() => null) : null;
  const left = pool.filter(k => !usedP.has(k) && S.squad[k].photo);
  if(rest.length && left.length && lim && lim.images && lim.images.maxCount >= 2){
    setCleanMsg('Asking Claude to recognise the rest…');
    try{
      const L = i => String.fromCharCode(65 + (i % 26)) + (i >= 26 ? Math.floor(i / 26) : '');
      const sheetA = await squadSheet(rest.slice(0, 36).map(i => items[i]), L), sheetB = await squadSheet(left.slice(0, 36).map(k => S.squad[k]));
      const ans = await sampleFn.json(`The first image shows new headshots, each with a letter in a black box. The second shows squad members, each with a number in a black box. Some squad pictures have big faded numbers or an X printed over the face; ignore those marks and compare only the people (face shape, hair, skin, features). Reply with only JSON mapping each letter to the number of the same person, or null if they are not in the squad, for example {"A": 3, "B": null}. Never use one number twice, and only match when you are confident.`, {images:[sheetA, sheetB], modelTier:'complex'});
      rest.slice(0, 36).forEach((i, n) => { const num = Number(ans && ans[L(n)]), pid = left[num - 1];
        if(num >= 1 && pid && !usedP.has(pid)){ setSquadPhoto(pid, items[i].photo, items[i].sig); usedP.add(pid); done.add(i); byClaude++; } });
    }catch(e){}
  }
  rest = items.map((it, i) => i).filter(i => !done.has(i));
  cleanPending = cleanPending.concat(rest.map(i => ({photo:items[i].photo, sig:items[i].sig, name:''})));
  const n = done.size;
  setCleanMsg(`${n} photo${n === 1 ? '' : 's'} matched${byClaude ? ` (${byClaude} by Claude)` : ''}.${rest.length ? ` Choose who the other ${rest.length} ${rest.length === 1 ? 'is' : 'are'} below.` : ''}`);
  save(); renderSetup(); renderGame(); update();
}

// ---------- team page screenshots ----------
const TEAM_PROMPT = `This is a screenshot of a team page from a sports app or website. Each player has a photo (often round) with their name underneath.
Reply with only JSON: {"players": [{"first": string, "last": string, "box": [x, y, w, h]}]}
"box" is the player's photo only (not the name), in coordinates where the whole image is 1000 wide and 1000 tall, with x,y the top-left corner.
Only include players whose photo AND name are both fully visible; skip anyone cut off at the top or bottom edge.
Example: {"first": "Elena", "last": "Sotgiu", "box": [134, 210, 236, 108]}`;
function lev(a, b){ const d = Array.from({length:a.length + 1}, (x, i) => [i]); for(let j = 1; j <= b.length; j++) d[0][j] = j;
  for(let i = 1; i <= a.length; i++) for(let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length]; }
// Find the squad member a full name belongs to: same first name, initials like "M&M", or a one-letter typo.
function findSquad(first, last){
  const f = String(first || '').trim().toLowerCase(), full = (f + ' ' + String(last || '').trim().toLowerCase()).trim(), ks = Object.keys(S.squad), nm = k => S.squad[k].name.trim().toLowerCase();
  const one = list => list.length === 1 ? list[0] : null;
  const f1 = f.split(/\s+/)[0]; // "Ivanna Berenice" is usually just "Ivanna"
  return one(ks.filter(k => nm(k) === f || nm(k) === full || nm(k) === f1))
    || one(ks.filter(k => nm(k).replace(/\s/g, '') === f1.split('-').map(w => w[0]).join('&')))
    || one(ks.filter(k => nm(k).length > 3 && lev(nm(k), f1) <= (f1.length > 5 ? 2 : 1)));
}
// Tighten Claude's box to the photo itself: everything that differs from the page background around it.
function refineBox(px, W, H, x, y, w, h){
  const pad = Math.max(w, h) * 0.12, x0 = Math.max(0, Math.floor(x - pad)), y0 = Math.max(0, Math.floor(y - pad)), x1 = Math.min(W - 1, Math.ceil(x + w + pad)), y1 = Math.min(H - 1, Math.ceil(y + h + pad));
  const i0 = (y0 * W + x0) * 4, bg = [px[i0], px[i0 + 1], px[i0 + 2]];
  let a = x1, b = y1, c = x0, d = y0;
  for(let Y = y0; Y <= y1; Y += 2) for(let X = x0; X <= x1; X += 2){ const i = (Y * W + X) * 4;
    if(Math.abs(px[i] - bg[0]) + Math.abs(px[i + 1] - bg[1]) + Math.abs(px[i + 2] - bg[2]) > 60){ if(X < a) a = X; if(X > c) c = X; if(Y < b) b = Y; if(Y > d) d = Y; } }
  if(c - a < w * 0.6 || d - b < h * 0.6) return [x, y, Math.min(w, h)];
  return [a, b, c - a];
}
function circleAvatar(src, x, y, side){
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  g.fillStyle = '#0e1319'; g.fillRect(0, 0, 128, 128); g.save(); g.beginPath(); g.arc(64, 64, 64, 0, Math.PI * 2); g.clip();
  g.drawImage(src, x, y, side, side, 0, 0, 128, 128); g.restore(); return c.toDataURL('image/jpeg', 0.85);
}
async function teamUpload(files){
  const lim = sampleFn ? await sampleFn.limits().catch(() => null) : null;
  if(!lim || !lim.images){ setCleanMsg('Reading screenshots needs Claude, which works when this page is open in Claude.'); return; }
  const found = {};
  for(let n = 0; n < files.length; n++){
    setCleanMsg(`Reading screenshot ${n + 1} of ${files.length}…`);
    try{
      const img = await loadImg(files[n]), sc = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * sc); cv.height = Math.round(img.naturalHeight * sc);
      const g = cv.getContext('2d'); g.drawImage(img, 0, 0, cv.width, cv.height);
      const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.9));
      const res = await sampleFn.json(TEAM_PROMPT, {images:[blob], modelTier:'default'});
      const px = g.getImageData(0, 0, cv.width, cv.height).data;
      (res && Array.isArray(res.players) ? res.players : []).forEach(p => {
        const bx = Array.isArray(p.box) ? p.box.map(Number) : null; if(!bx || !p.first) return;
        const [x, y, side] = refineBox(px, cv.width, cv.height, bx[0] / 1000 * cv.width, bx[1] / 1000 * cv.height, bx[2] / 1000 * cv.width, bx[3] / 1000 * cv.height);
        const key = (String(p.first) + ' ' + String(p.last || '')).trim().toLowerCase();
        if(side > 20 && (!found[key] || found[key].side < side)) found[key] = {first:String(p.first).trim(), last:String(p.last || '').trim(), side, photo:circleAvatar(cv, x, y, side)};
      });
    }catch(e){ if(e && e.code === 'not_granted'){ setCleanMsg(readErr(e)); return; } }
  }
  let updated = [], added = [];
  Object.values(found).forEach(p => {
    const pid = findSquad(p.first, p.last);
    if(pid){ setSquadPhoto(pid, p.photo, null); updated.push(S.squad[pid].name); }
    else { const id = uid(); S.squad[id] = {name:p.first, photo:p.photo, clean:true, sigs:[]}; added.push(p.first); }
  });
  setCleanMsg(Object.keys(found).length
    ? `New photos for ${updated.length} player${updated.length === 1 ? '' : 's'}${updated.length ? ': ' + updated.join(', ') : ''}.${added.length ? ` Added ${added.length} new: ${added.join(', ')}.` : ''} Check the squad list below.`
    : 'No players with a photo and a name were found in those screenshots.');
  save(); renderSetup(); renderGame(); update();
}
