    if(snap.exists){
      const body = strip(snap.data()), js = stable(body);
      if(sync.last['live/game'] !== js && body.game){
        sync.last['live/game'] = js;
        S.game = body.game; S.game.history = []; // undo only covers this phone's own actions
        if(body.activeId && S.schedules.some(x => x.id === body.activeId)) S.activeId = body.activeId;
        const g = S.game, fits = g.tr && U().tracks.every(t => g.tr[t.id] && g.acc[t.id] && g.acc[t.id].length === t.players.length) && Object.keys(g.tr).length === U().tracks.length;
        if(!fits && body.lines && body.activeId === S.activeId) U().tracks = body.lines.map(t => Object.assign({}, t, {players:t.players.map(p => Object.assign({photo:photoFor(p.pid)}, p))}));
        injUI = null; cardUI = null; afterRemote();
      }
    }
    markGot('live', snap);
  }, () => setSync('error'));
}
if(window.claude && window.claude.use){
  window.claude.use('db').then(d => { if(d){ db = d; setSync('saving'); startSync(); setTimeout(() => { if(!sync.ready) setSync('error'); }, 20000); } else setSync('local'); }).catch(() => setSync('local'));
  window.claude.use('downloads').then(d => { dl = d; if(S.view === 'minutes') renderMinutes(); }).catch(() => {});
}

// ---------- clicks ----------
let resetArm = 0, resetAsk = false;
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const a = b.dataset.act, u = U();
  // Tap protection: "Swap done" / "Already swapped" need a second tap within 3 s.
  // A line reset always asks for the second tap.
  if(((a === 'swap' && S.settings.confirm) || a === 'resetline') && !(b.dataset.armed && Date.now() - b.dataset.armed < 3000)){
    const old = b.textContent; b.dataset.armed = Date.now(); b.textContent = 'Tap again to confirm'; b.classList.add('armed');
    setTimeout(() => { if(b.isConnected){ b.textContent = old; delete b.dataset.armed; b.classList.remove('armed'); } }, 3000);
    return;
  }
  if(a === 'tab'){ S.view = b.dataset.v; save(); show(); }
  else if(a === 'testbuzz'){ ensureAudio(); beep(3, 1040); buzz([300,120,300,120,300]);
    $('buzzmsg').textContent = canVibrate() ? 'Did your phone buzz? If not, check that vibration is on in your phone’s sound settings.'
      : 'You should hear three beeps. On iPhone you may feel a light tap instead of a strong buzz, because iPhones limit what web pages can do. Keep the volume up and silent mode off.'; }
  else if(a === 'cardopen'){ cardUI = cardUI && cardUI.id === b.dataset.id ? null : {id:b.dataset.id, k:null}; injUI = null; renderGame(); update(); }
  else if(a === 'cardpick'){ cardUI = {id:b.dataset.id, k:+b.dataset.k}; renderGame(); update(); }
  else if(a === 'cardclose'){ cardUI = null; renderGame(); update(); }
  else if(a === 'cardgive') giveCard(b.dataset.id, +b.dataset.k, b.dataset.type);
  else if(a === 'practice'){ S.game = newGame(U()); S.game.speed = 10; S.game.practice = true; save(); show(); }
  else if(a === 'endpractice'){ S.game = newGame(U()); save(); show(); }
  else if(a === 'copyreport') copyReport();
  else if(a === 'csv') saveCsv();
  else if(a === 'savematch'){ saveMatch(); reportMsg = 'Added to the season log.'; renderMinutes(); }
  else if(a === 'delmatch'){ S.matches = S.matches.filter(x => x.id !== b.dataset.mid); save(); renderMinutes(); }
  else if(a === 'addo'){ const sc = sched(); sc.others = sc.others || []; sc.others.push({name:'', photo:'', why:'Reserve', pid:uid()}); save(); renderSetup(); }
  else if(a === 'delo'){ (sched().others || []).splice(+b.dataset.i, 1); save(); renderSetup(); }
  else if(a === 'go') go();
  else if(a === 'fullscreen'){
    // Fills the screen, hiding the viewer's banner, where the device allows it.
    const el = document.documentElement;
    if(document.fullscreenElement) document.exitFullscreen && document.exitFullscreen().catch(() => {});
    else if(el.requestFullscreen) el.requestFullscreen().catch(() => { b.hidden = true; });
  }
  else if(a === 'adj') adj(+b.dataset.d);
  else if(a === 'swap') swap(b.dataset.id);
  else if(a === 'undo') undo();
  else if(a === 'resetlines') resetLines();
  else if(a === 'resetline') resetLine(b.dataset.id);
  else if(a === 'addrule'){ U().rules = rules().concat({type:'min', n:1, pids:[]}); save(); renderSetup(); }
  else if(a === 'delrule'){ U().rules = rules().filter((r, i) => i !== +b.dataset.i); save(); renderSetup(); renderGame(); }
  else if(a === 'leopen'){ openLineEdit(); renderGame(); update(); window.scrollTo(0, 0); }
  else if(a === 'lecancel'){ lineEdit = null; renderGame(); update(); }
  else if(a === 'leadd'){ lineEdit[+b.dataset.li].players.push({pid:null, name:'', bench:2}); renderGame();
    const l = lineEdit[+b.dataset.li], f = $(`le-${b.dataset.li}-${l.players.length - 1}-name`); if(f) f.focus(); }
  else if(a === 'fullopen'){ keepUI = keepUI && keepUI.pid === b.dataset.pid && !keepUI.pick ? null : {pid:b.dataset.pid, pick:null}; renderGame(); }
  else if(a === 'fullclose'){ keepUI = null; renderGame(); }
  else if(a === 'spotline'){ keepUI = {pid:b.dataset.pid, mode:'fullswap', pick:{current:true}}; renderGame(); }
  else if(a === 'placedmove'){ keepUI = {pid:b.dataset.pid, pick:{moveIn:true}}; renderGame(); }
  else if(a === 'fulloff' || a === 'fullswap'){
    // Step 1: who comes on. "No one" happens straight away; anyone else goes on to step 2 (where she plays).
    const pid = b.dataset.pid;
    if(b.dataset.none){ (a === 'fulloff' ? fullOff : spotSwap)(pid, null); return; }
    let pick;
    if(b.dataset.line != null) pick = {line:b.dataset.line, k:+b.dataset.k};
    else { const inp = $('fullres-' + pid), nm = String(b.dataset.name || (inp ? inp.value : '')).trim(), msg = $('fullmsg-' + pid);
      if(!isRealName(nm)){ if(inp){ inp.placeholder = 'Type who comes on first'; inp.focus(); } return; }
      const hit = squadByName(nm) || findSquad(nm, ''), onB = hit && benchCandidates().find(c => c.pid === hit);
      if(onB) pick = {line:onB.line, k:onB.k};
      else if(hit && onFieldNow().has(hit)){ if(msg) msg.textContent = `${S.squad[hit].name} is on the field already.`; return; }
      else pick = {name: hit ? S.squad[hit].name : nm, pid: hit || null}; }
    // Straight away, in the place picked in the box: the spot, or a line.
    const place = (keepUI && keepUI.place) || 'spot';
    (a === 'fulloff' ? fullOff : spotSwap)(pid, pick, place === 'spot' ? 'spot' : 'line', place === 'spot' ? null : place); }
  else if(a === 'fullplace'){ const ku = keepUI; if(!ku || !ku.pick) return;
    if(ku.pick.moveIn) placedToLine(ku.pid, b.dataset.line);
    else if(ku.pick.current) spotToLine(ku.pid, b.dataset.line);
    else (ku.mode === 'fullswap' ? spotSwap : fullOff)(ku.pid, ku.pick, b.dataset.where, b.dataset.line); }
  else if(a === 'fullback'){ const k = (G().keep || {})[b.dataset.pid] || {};
    // No one came on in her place: she just comes back. Otherwise pick who comes off.
    if(!k.by && !k.toLine) fullBack(b.dataset.pid, null);
    else { keepUI = {pid:b.dataset.pid, back:true}; renderGame(); } }
  else if(a === 'fullbackoff') fullBack(b.dataset.pid, b.dataset.who === 'spot' ? null : {line:b.dataset.line, k:+b.dataset.k});
  else if(a === 'leaddline'){ addDraftLine(); renderGame(); const f = $(`le-${lineEdit.length - 1}-0-name`); if(f){ f.scrollIntoView({block:'center'}); f.focus({preventScroll:true}); } }
  else if(a === 'leunfull'){ const x = lineEdit.toFull.splice(+b.dataset.i, 1)[0], l = x && lineEdit.find(y => y.id === x.from);
    if(l) l.players.push({pid:x.pid, name:x.name, bench:+x.bench || 2}); renderGame(); }
  else if(a === 'ledel'){ lineEdit[+b.dataset.li].players.splice(+b.dataset.k, 1); renderGame(); }
  else if(a === 'leup'){ const ps = lineEdit[+b.dataset.li].players, k = +b.dataset.k; [ps[k - 1], ps[k]] = [ps[k], ps[k - 1]]; renderGame(); }
  else if(a === 'leapply' || a === 'leorig'){
    const err = applyLines(a === 'leorig' ? clone(sched().original) : lineEdit);
    if(err){ lineMsg = err; const el = $('lemsg'); if(el) el.textContent = err; }
  }
  else if(a === 'viewmatch'){ openMatch = openMatch === b.dataset.mid ? null : b.dataset.mid; renderMinutes(); }
  else if(a === 'copymatch'){ const m = S.matches.find(x => x.id === b.dataset.mid); if(m) copyReport(savedReport(m)); }
  else if(a === 'injopen'){ injUI = injUI && injUI.id === b.dataset.id ? null : {id:b.dataset.id, k:null}; cardUI = null; renderGame(); update(); }
  else if(a === 'injpick'){ injUI = {id:b.dataset.id, k:+b.dataset.k}; renderGame(); update(); }
  else if(a === 'injclose'){ injUI = null; renderGame(); update(); }
  else if(a === 'injbench') injure(b.dataset.id, +b.dataset.k, 'bench');
  else if(a === 'injres'){ const inp = $('res-' + b.dataset.id), nm = String(b.dataset.name || (inp ? inp.value : '')).trim();
    if(!isRealName(nm)){ const m = $('resmsg-' + b.dataset.id); if(m) m.textContent = 'Type the reserve’s name first, so their minutes go to the right person.'; if(inp) inp.focus(); return; }
    injure(b.dataset.id, +b.dataset.k, 'reserve', nm); }
  else if(a === 'back') backOn(b.dataset.id, +b.dataset.k);
  else if(a === 'stagger') autoStagger();
  else if(a === 'addp'){ const t = track(b.dataset.id); t.players.push({name:`${t.name} ${t.players.length+1}`, bench:2}); structural(); }
  else if(a === 'delp'){ track(b.dataset.id).players.splice(+b.dataset.k, 1); structural(); }
  else if(a === 'addt'){ const id = 't' + Date.now(); u.tracks.push({id, name:'New line', color:'#2E8B57', offset:0, players:[{name:'Player 1',bench:3},{name:'Player 2',bench:3}]}); structural(); }
  else if(a === 'delt'){ u.tracks = u.tracks.filter(t => t.id !== b.dataset.id); structural(); }
  else if(a === 'defaults'){ sched().setup = clone(DEFAULT_SETUP); structural(); }
  else if(a === 'up'){ const ps = track(b.dataset.id).players, k = +b.dataset.k; [ps[k-1], ps[k]] = [ps[k], ps[k-1]]; structural(); }
  else if(a === 'sdup'){ const id = 's' + Date.now(); S.schedules.push({id, name:sched().name + ' (copy)', setup:clone(U()), others:clone(sched().others || [])}); S.activeId = id; structural(); }
  else if(a === 'snew'){ const id = 's' + Date.now();
    S.schedules.push({id, name:'New schedule', setup:{quarterMin:u.quarterMin, quarters:u.quarters, tracks:[{id:'t'+Date.now(), name:'Line 1', color:'#E3262B', offset:0, players:[{name:'Player 1',bench:3},{name:'Player 2',bench:3},{name:'Player 3',bench:3}]}]}});
    S.activeId = id; structural(); }
  else if(a === 'sdel'){ S.removed = [...new Set(S.removed.concat(S.activeId))]; S.schedules = S.schedules.filter(x => x.id !== S.activeId); S.activeId = S.schedules[0].id; structural(); }
  else if(a === 'stopread'){ if(readCtl) readCtl.abort(); }
  else if(a === 'sqdel'){ delete S.squad[b.dataset.pid]; save(); renderSquad(); }
  else if(a === 'exportdata') exportFile();
  else if(a === 'savekey'){ const v = ($('api-key') || {}).value || ''; if(v.trim()){ setKey(v.trim()); useApiKey(); renderSetup(); } }
  else if(a === 'delkey'){ setKey(''); useApiKey(); renderSetup(); }
  else if(a === 'pickimport'){ const f = $('import-file'); if(f) f.click(); }
  else if(a === 'pickteam'){ const f = $('team-files'); if(f) f.click(); }
  else if(a === 'pickclean'){ const f = $('clean-files'); if(f) f.click(); }
  else if(a === 'cpskip'){ cleanPending.splice(+b.dataset.i, 1); renderSetup(); }
  else if(a === 'pickboard'){ const f = $('board-file'); if(f) f.click(); }
  else if(a === 'pickph'){ const f = $(b.dataset.for); if(f) f.click(); }
  else if(a === 'call') callSwap(b.dataset.id);
  else if(a === 'cancel') cancelCall(b.dataset.id);
  else if(a === 'reset'){
    // A match with minutes that isn't in the season log yet: ask first, so its minutes aren't lost.
    const g = G();
    if(g.phase !== 'pre' && !g.practice && !isSaved(g)){ resetAsk = true; renderSetup(); const el = $('resetask'); if(el) el.scrollIntoView({block:'center'}); return; }
    if(Date.now() - resetArm < 3000){ S.game = newGame(U()); resetArm = 0; save(); show(); }
    else { resetArm = Date.now(); b.textContent = 'Tap again to reset'; setTimeout(() => { if(b.isConnected) b.textContent = 'Reset game'; }, 3000); }
  }
  else if(a === 'resetsave'){ recordMatch(); S.game = newGame(U()); resetAsk = false; save(); show(); }
  else if(a === 'resetnosave'){ S.game = newGame(U()); resetAsk = false; save(); show(); }
  else if(a === 'resetcancel'){ resetAsk = false; renderSetup(); }
  else if(a === 'fixmatch'){ fixMatch = b.dataset.mid; renderMinutes(); }
  else if(a === 'fixcancel'){ fixMatch = null; renderMinutes(); }
  else if(a === 'fixsave'){ const m = S.matches.find(x => x.id === b.dataset.mid); if(!m) return;
    // Corrected minutes (m:ss or whole minutes); the match is then marked as corrected and never overwritten.
    let bad = false;
    m.rows.forEach((r, i) => { const el = $(`fix-${i}`); if(!el) return; const v = el.value.trim(), mm = v.match(/^(\d{1,3})(?::(\d{1,2}))?$/);
      if(!mm){ bad = true; el.classList.add('bad'); return; } r.played = (+mm[1]) * 60 + (+(mm[2] || 0)); });
    if(bad){ const el = $('fixmsg'); if(el) el.textContent = 'Write minutes like 12:30 or 12.'; return; }
    m.edited = true; fixMatch = null; save(); renderMinutes(); }
});
function structural(){ ensureSquad(); S.game = newGame(U()); save(); show(); }

function renderSquad(){
  const el = $('squadlist'); if(!el) return;
  const ids = Object.keys(S.squad).sort((a, b) => S.squad[a].name.localeCompare(S.squad[b].name));
  el.innerHTML = ids.length
    ? `<div class="squad">${ids.map(k => `<div class="sq"><button class="avbtn" data-act="pickph" data-for="sqph-${k}" aria-label="Change photo of ${esc(S.squad[k].name)}">${av(S.squad[k])}</button><input type="file" id="sqph-${k}" accept="image/*" class="vh" tabindex="-1" aria-hidden="true"><input type="text" id="sq-${k}-name" value="${esc(S.squad[k].name)}" aria-label="Name"><button data-act="sqdel" data-pid="${k}" aria-label="Remove ${esc(S.squad[k].name)} from the squad">×</button></div>`).join('')}</div>`
    : '<p class="note">No one yet. Type a real name for a player above and they’re added here with their photo.</p>';
}
document.addEventListener('change', e => {
  const id = e.target.id; let m;
  if(m = id.match(/^le-(\d+)-(lname|lcolor)$/)){ const l = lineEdit && lineEdit[+m[1]]; if(!l) return;
    const v = e.target.value; if(m[2] === 'lcolor'){ const was = PALETTE.find(p => p[1] === l.color); l.color = v; if(!l.named && was && l.name === was[0]) l.name = (PALETTE.find(p => p[1] === v) || [l.name])[0]; }
    else { l.name = v.trim() || l.name; l.named = true; }
    renderGame(); return; }
  if(m = id.match(/^rule-(\d+)-(type|n)$/) || id.match(/^rule-(\d+)-p-(.+)$/)){ const r = rules()[+m[1]]; if(!r) return;
    if(m[2] === 'type') r.type = e.target.value === 'max' ? 'max' : 'min';
    else if(m[2] === 'n') r.n = Math.max(0, Math.round(+e.target.value || 0));
    else r.pids = e.target.checked ? [...new Set(r.pids.concat(m[2]))] : r.pids.filter(p => p !== m[2]);
    save(); renderSetup(); renderGame(); return; }
  if(m = id.match(/^fullline-(.+)$/)){ if(keepUI) keepUI.place = e.target.value; return; }
  if(m = id.match(/^le-(\d+)-(\d+)-name$/)){ const p = lineEdit && lineEdit[+m[1]] && lineEdit[+m[1]].players[+m[2]]; if(!p) return;
    // A name the squad knows (small typos included) links to that player, so she can be moved out of her old line.
    const nm = e.target.value.trim(), pid = nm ? (squadByName(nm) || findSquad(nm, '')) : null;
    p.name = nm; p.pid = pid || null; p.typed = Date.now();
    if(pid){ p.name = S.squad[pid].name; e.target.value = p.name; }
    showMoves(); return; }
  if(m = id.match(/^le-(\d+)-(\d+)-move$/)){ const from = lineEdit && lineEdit[+m[1]], v = e.target.value; if(!from) return;
    // Full game: she stops swapping and plays on. Reserves: she's off, available as a reserve.
    if(v === 'full' || v === 'res'){ const p = from.players.splice(+m[2], 1)[0];
      if(v === 'full' && p && String(p.name || '').trim()){ const pid = p.pid || squadByName(p.name) || findSquad(p.name, '') || null;
        lineEdit.toFull.push({pid, name: pid && S.squad[pid] ? S.squad[pid].name : p.name, from:from.id, bench:p.bench}); }
      renderGame(); return; }
    const to = lineEdit[+v]; if(!to || from === to) return;
    to.players.push(from.players.splice(+m[2], 1)[0]); renderGame(); return; }
  if(m = id.match(/^p-(.+)-(\d+)-name$/)){ const t = track(m[1]), p = t && t.players[+m[2]]; if(!p) return;
    couple(p); syncSquadPhotos(); e.target.value = p.name; save(); renderSetup(); renderGame(); update(); }
  else if(m = id.match(/^o-(\d+)-name$/)){ const o = (sched().others || [])[+m[1]]; if(!o) return;
    o.name = e.target.value.trim(); couple(o); syncSquadPhotos(); e.target.value = o.name; save(); renderSetup(); renderGame(); update(); }
  else if(m = id.match(/^sq-(.+)-name$/)){ const sq = S.squad[m[1]], v = e.target.value.trim(); if(!sq || !v) return;
    sq.name = v; allPlayers().forEach(q => { if(q.pid === m[1]) q.name = v; }); save(); renderSetup(); renderGame(); update(); }
});

function show(){
  ensureGameFits();
  ['game','plan','minutes','setup'].forEach(v => { $('v-'+v).hidden = S.view !== v; });
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.v === S.view));
  renderGame();
  if(S.view === 'plan') renderPlan();
  if(S.view === 'minutes') renderMinutes();
  if(S.view === 'setup') renderSetup();
  update();
}

// The big header scrolls away with the page; the slim bar shows once it is out of view.
if('IntersectionObserver' in window){
  new IntersectionObserver(([e]) => { $('mini').hidden = e.isIntersecting; }, {threshold:0}).observe(document.querySelector('.clockrow'));
}
// Full screen where the browser supports it (not on iPhone).
if(document.fullscreenEnabled && document.documentElement.requestFullscreen){
  $('fsbtn').hidden = false;
  document.addEventListener('fullscreenchange', () => { $('fsbtn').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; });
}
show();
setInterval(tick, 250);
setInterval(save, 5000);
})();
